# Build tuning only. No secrets belong in this file. Signing values come from the environment
# (see docs/android-runtime.md), and that is checked when a release task is requested.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Android versions are independent of the web app's package.json version.
# Override per build with -PbizaVersionName=... -PbizaVersionCode=...
bizaVersionName=0.1.0
bizaVersionCode=1
