name: bizamiz-demo

x-demo-profile: &demo-profile
  BIZAMIZ_DEPLOYMENT_PROFILE: demo
  DEMO_DATABASE_ID: ${DEMO_DATABASE_ID:?Set a new demo database UUID}
  DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:?Set a demo-only session secret}

services:
  db:
    image: ${DEMO_POSTGRES_IMAGE:?Set a PostgreSQL 16 image digest}
    environment:
      POSTGRES_DB: bizamiz_demo
      POSTGRES_USER: demo_migrator
      POSTGRES_PASSWORD: ${DEMO_MIGRATOR_PASSWORD:?Set a demo-only migration password}
      DEMO_DATABASE_ID: ${DEMO_DATABASE_ID:?Set a new demo database UUID}
    configs:
      - source: initialize-demo-db
        target: /docker-entrypoint-initdb.d/010-demo-marker.sh
    volumes:
      - demo-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, demo_migrator, -d, bizamiz_demo]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 1g
    networks: [demo-private]

  migrate:
    image: ${DEMO_APP_IMAGE:?Set the tested Biza Miz image digest}
    user: node
    environment:
      <<: *demo-profile
      DATABASE_URL: postgres://demo_migrator:${DEMO_MIGRATOR_PASSWORD:?Set a demo-only migration password}@db:5432/bizamiz_demo
      APP_DB_USER: demo_app
      APP_DB_PASSWORD: ${DEMO_APP_DB_PASSWORD:?Set a demo-only application password}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        node ./node_modules/tsx/dist/cli.mjs scripts/migrate.ts
        node ./node_modules/tsx/dist/cli.mjs scripts/create-app-role.ts
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 768m
    networks: [demo-private]

  redis:
    image: ${DEMO_REDIS_IMAGE:?Set a Redis image digest}
    user: redis
    environment:
      REDISCLI_AUTH: ${DEMO_REDIS_PASSWORD:?Set a demo-only Redis password}
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'requirepass %s\n' "$$REDISCLI_AUTH" > /tmp/demo-redis.conf
        exec redis-server /tmp/demo-redis.conf --appendonly yes
    volumes:
      - demo-redis:/data
    healthcheck:
      test: [CMD-SHELL, 'test "$$(redis-cli ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    mem_limit: 512m
    networks: [demo-private]

  storage:
    image: ${DEMO_STORAGE_IMAGE:?Set a MinIO-compatible image digest}
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: demo-storage-admin
      MINIO_ROOT_PASSWORD: ${DEMO_STORAGE_ADMIN_PASSWORD:?Set a demo-only object store admin password}
    volumes:
      - demo-storage:/data
    restart: unless-stopped
    mem_limit: 1g
    networks: [demo-private]

  web:
    image: ${DEMO_APP_IMAGE:?Set the tested Biza Miz image digest}
    user: node
    entrypoint: [node, ./node_modules/tsx/dist/cli.mjs, server.ts]
    command: []
    environment:
      <<: *demo-profile
      NODE_ENV: production
      DEPLOYMENT_ROLE: central
      PORT: "3000"
      DATABASE_URL: postgres://demo_app:${DEMO_APP_DB_PASSWORD:?Set a demo-only application password}@db:5432/bizamiz_demo
      JWT_SECRET: ${DEMO_JWT_SECRET:?Set a demo-only JWT secret}
      POS_MASTER_KEY: ${DEMO_MASTER_KEY:?Set a demo-only encryption key}
      HEALTH_VERSION_TOKEN: ${DEMO_HEALTH_VERSION_TOKEN:?Set a demo-only health token}
      LITELLM_ENABLED: "false"
      ALLOW_PUBLIC_SIGNUP: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    networks: [demo-private]

configs:
  initialize-demo-db:
    content: |
      psql --set=ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        --set=demo_marker="bizamiz-demo:$$DEMO_DATABASE_ID" <<'SQL'
      COMMENT ON DATABASE bizamiz_demo IS :'demo_marker';
      SQL

networks:
  demo-private:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  demo-db:
  demo-redis:
  demo-storage:
