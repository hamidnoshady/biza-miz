# Optional container-based on-site server stack for Linux/server operators.
# This is not the Windows standalone architecture; Windows uses Electron with
# embedded PostgreSQL and the explicit local HTTPS gateway.
#
# This is the box that lives INSIDE the café on the same LAN as the phones,
# cashier, and kitchen display. It runs the full app + its own Postgres, so
# the café keeps working with ZERO internet. When internet is up, it syncs
# bidirectionally with the VPS (pos.eshobe.com) via the server-sync engine.
#
# Setup:
#   1. Give this machine a fixed LAN IP (router DHCP reservation or static).
#   2. Copy .env.local.example → .env and fill JWT_SECRET, POSTGRES_PASSWORD.
#   3. Authenticate to the image registry and run
#      `docker compose -f docker-compose.local.yml pull && up -d`.
#   4. In the Owner dashboard, configure server-sync to point at the VPS URL
#      and the site-scoped token.
#
# The app service below runs a prebuilt image from GHCR, not a local build: a
# café laptop shouldn't need the source tree, npm, or a build toolchain, just
# Docker. Note that this repo's CI does not publish that image — it is
# test-only (.github/workflows/test.yml) — so the tag you pin has to have been
# built and pushed separately. Pin
# POS_IMAGE_TAG to a release (e.g. v1.4.2) rather than the default :latest
# once you're past initial setup, so this laptop only moves versions when you
# choose to, not on every merge to main.
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pos}
    volumes:
      - pos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${POS_IMAGE:-ghcr.io/hamidnoshady/biza-miz}:${POS_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Allow server.ts to drain active sales, WebSockets and background jobs.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Superuser on purpose: docker-entrypoint.sh migrates with this, then
      # provisions a restricted pos_app role from it and launches the server
      # with that instead — the process never actually runs as this role. See
      # scripts/derive-runtime-database-url.ts and the README's tenancy section.
      DATABASE_URL: postgres://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pos}
      # MUST be a real secret. Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      # Phase 23: this is a site, not the central server — it syncs *to* one.
      # Declared explicitly because REMOTE_SYNC_TOKEN (which a laptop accepting
      # inbound sync also sets) would otherwise make the inference guess
      # "central".
      DEPLOYMENT_ROLE: site
      BACKUP_DIR: /app/backups
      # Shared bearer token guarding THIS server's /api/server-sync endpoints.
      # If you want the VPS to also push/pull to this laptop, set the same
      # token the laptop's dashboard config uses. Generate: openssl rand -hex 32
      ALLOW_LEGACY_SYNC_TOKEN: ${ALLOW_LEGACY_SYNC_TOKEN:-}
      # Phase 24 Wave 4: WebAuthn requires a host RP ID
      WEBAUTHN_RP_ID: ${POS_LOCAL_HOST:-pos.cafe.lan}
      WEBAUTHN_ORIGIN: https://${POS_LOCAL_HOST:-pos.cafe.lan}
    expose:
      # Exposed internally to Caddy, not published to the host directly
      - "3000"
    volumes:
      - pos-backups:/app/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${BIND_ADDR:-0.0.0.0}:80:80"
      - "${BIND_ADDR:-0.0.0.0}:443:443"
    environment:
      POS_LOCAL_HOST: ${POS_LOCAL_HOST:-pos.cafe.lan}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pos-pgdata:
  pos-backups:
  caddy_data:
  caddy_config:
