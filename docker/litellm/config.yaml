# LiteLLM proxy configuration.
#
# This file is the bundled proxy's deployment configuration. Keep upstream
# credentials in the deployment environment/secret store; never commit them.
# Start the bundled proxy with `docker compose --profile ai up -d litellm`.
#
# Ownership boundary:
# - This file/LiteLLM owns upstream deployments, model aliases, routing,
#   retries, fallbacks, provider-side rate limits and any gateway-side budgets.
# - The application stores the default chat/embedding aliases in
#   platform_ai_gateway and the runtime-mode-to-alias mapping in
#   platform_ai_modes. Configure those aliases here too.
# - The application owns its prompt versions, permission-filtered function
#   tools, and Rial billing. It does not send LiteLLM prompt IDs or proxy MCP
#   declarations, and it has no local fallback/model/MCP policy mirror.
# - LiteLLM's proxy MCP feature and the POS's independent `/api/mcp` connector
#   are not wired together by this template.
#
# The old application-side policy mirror columns were removed by migration
# 0184. Change routing/provider policy here, not on a per-business key row.

model_list:
  # Primary chat alias. Point this at the provider/model you have contracted.
  - model_name: pos-chat
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      rpm: 60

  # Example failover alias. The proxy router below applies it to pos-chat.
  - model_name: pos-cheap
    litellm_params:
      model: openai/gpt-4.1-nano
      api_key: os.environ/OPENAI_API_KEY
      rpm: 120

  # Embeddings can use a different upstream deployment from chat.
  - model_name: pos-embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

# MUST be set. This management credential is also entered/stored encrypted in
# the platform_ai_gateway row; it is never sent to a browser.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # LiteLLM's own DB for virtual keys, provider-side budgets and spend logs.
  # It is separate from the POS application's database.
  database_url: os.environ/LITELLM_DATABASE_URL
  # Tenant virtual keys may not alter the proxy's deployment catalogue.
  disable_add_model_via_api: true

litellm_settings:
  num_retries: 3
  request_timeout: 120
  # Ignore parameters unsupported by a selected upstream rather than rejecting
  # otherwise-valid OpenAI-compatible requests.
  drop_params: true

router_settings:
  # Proxy-side routing policy; it is not changed by /platform/ai.
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  allowed_fails: 3
  cooldown_time: 30

  # Fail over between alias groups when the primary group has no healthy
  # deployment. A second deployment can also be added under one alias for
  # within-group balancing.
  fallbacks:
    - pos-chat:
        - pos-cheap
  default_fallbacks:
    - pos-cheap
