services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional bundled LiteLLM proxy. The application has no direct-provider
  # fallback: leaving this profile off means AI is unavailable unless the app
  # is pointed at a separately managed LiteLLM instance. Start the bundled
  # proxy with:
  #
  #   docker compose --profile ai up -d litellm
  #
  # Then set the connection/default aliases in /platform/ai (or LITELLM_* at
  # bootstrap) and provision tenant virtual keys as needed. The proxy is bound
  # to the compose network only — never published to the host — because it
  # holds upstream provider credentials and its management API can mint keys
  # and read spend.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles:
      - ai
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      # LiteLLM keeps its own database for virtual keys, budgets and spend
      # logs. It is deliberately NOT the application's database: the gateway
      # manages its own schema and migrates it on boot. Create the *database*
      # once first (`createdb -U pos litellm` inside the db container) — the
      # gateway creates its tables, but not the database.
      LITELLM_DATABASE_URL: postgres://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD:-pos}@db:5432/${LITELLM_DB:-litellm}
      # Upstream provider credential consumed by LiteLLM only; the POS app does not read it.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")'"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pos-pgdata:
