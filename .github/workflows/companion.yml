# Issue #984 — the standalone Windows support companion (.NET 10).
#
# Builds and tests companion/ on GitHub-hosted Windows runners. The companion
# is the one native component in the repo, so it gets its own workflow rather
# than a job in test.yml: its toolchain (dotnet SDK, NuGet restore, DPAPI and
# file-lock tests that only pass on real Windows) shares nothing with the
# Node suite. Triggers mirror test.yml (PRs plus pushes to main and Arena
# branches — GitHub suppresses Arena-App PR-synchronize events, so the push
# trigger is what actually runs on Arena PRs), narrowed by paths so unrelated
# changes do not spend Windows minutes here.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  push:
    branches: [main, 'arena/**']
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"

concurrency:
  group: companion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Windows PowerShell 5.1 — always present on Windows, unlike `pwsh`.
    shell: powershell

jobs:
  build-test:
    name: companion build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore companion/Biza.SupportCompanion.sln

      - name: Build (Release)
        run: dotnet build companion/Biza.SupportCompanion.sln --no-restore --configuration Release

      - name: Test (Release)
        run: |
          dotnet test companion/Biza.SupportCompanion.sln --no-build --configuration Release --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath test-output.txt
          exit $LASTEXITCODE
        env:
          # Lets the xUnit test host roll forward onto the .NET 10 runtime
          # when the pinned Test SDK predates it. Test-only; the shipped
          # companion targets its runtime exactly.
          DOTNET_ROLL_FORWARD: Major

      # dotnet-test failures do not surface as check annotations on their own,
      # so a red run would otherwise say only "exit code 1". Re-emit the
      # interesting output lines as error annotations, which are readable from
      # the checks API without log access.
      - name: Surface test failures as annotations
        if: failure()
        run: |
          if (-not (Test-Path test-output.txt)) {
            Write-Host "::error title=companion test output::test-output.txt is missing; the test step never produced output"
            exit 0
          }
          $lines = Get-Content test-output.txt
          Write-Host "::error title=companion test output::$($lines.Count) lines captured"
          $emitted = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            $trimmed = $lines[$i].Trim()
            if ($trimmed -eq '') { continue }
            # Skip passed tests even when the test NAME contains "fail"
            # (e.g. FailsClosedOnUnknownKid) — they ate the whole budget.
            if ($trimmed -match '^Passed\s') { continue }
            if ($trimmed -match '(?i)^Failed\s|Failed!|Failed:|Error Message:|Assert\.|Expected:|Actual:|error MSB|Exception') {
              if ($trimmed -match '^Failed\s+(\S+)') {
                # Attach the assertion message that follows the failure header.
                $detail = @()
                for ($j = $i + 1; $j -lt [Math]::Min($i + 8, $lines.Count); $j++) {
                  $d = $lines[$j].Trim()
                  if ($d -match '(?i)Stack Trace:') { break }
                  if ($d -ne '') { $detail += $d }
                }
                $trimmed = $trimmed + ' :: ' + (($detail -join ' ') -replace '\s+', ' ')
              }
              if ($trimmed.Length -gt 900) { $trimmed = $trimmed.Substring(0, 900) }
              Write-Host "::error title=dotnet test::$trimmed"
              $emitted++
              if ($emitted -ge 15) { break }
            }
          }
          if ($emitted -eq 0) {
            $tail = ($lines | Select-Object -Last 8) -join ' '
            if ($tail.Length -gt 900) { $tail = $tail.Substring(0, 900) }
            Write-Host "::error title=dotnet test tail::$tail"
          }
