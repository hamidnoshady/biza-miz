# Issue #984 — the standalone Windows support companion (.NET 10).
#
# Builds and tests companion/ on GitHub-hosted Windows runners. The companion
# is the one native component in the repo, so it gets its own workflow rather
# than a job in test.yml: its toolchain (dotnet SDK, NuGet restore, DPAPI and
# file-lock tests that only pass on real Windows) shares nothing with the
# Node suite. Triggers mirror test.yml (PRs plus pushes to main and Arena
# branches — GitHub suppresses Arena-App PR-synchronize events, so the push
# trigger is what actually runs on Arena PRs), narrowed by paths so unrelated
# changes do not spend Windows minutes here.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  push:
    branches: [main, 'arena/**']
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"

concurrency:
  group: companion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Windows PowerShell 5.1 — always present on Windows, unlike `pwsh`.
    shell: powershell

jobs:
  build-test:
    name: companion build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore companion/Biza.SupportCompanion.sln

      - name: Build (Release)
        run: dotnet build companion/Biza.SupportCompanion.sln --no-restore --configuration Release

      # TEMPORARY DIAGNOSTIC SPLIT: the combined run dies mid-way with no
      # summary, so each test class gets its own step — per-step conclusions
      # (visible via API) isolate the killer deterministically. Revert to one
      # step once green.
      - name: Test class CompanionPaths
        id: paths
        continue-on-error: true
        run: |
          dotnet test companion/Biza.SupportCompanion.sln --no-build --configuration Release --filter "FullyQualifiedName~CompanionPathsTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=results-paths.trx" 2>&1 | Tee-Object -FilePath test-output-paths.txt
          exit $LASTEXITCODE
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Test class SupportProtocol
        id: protocol
        continue-on-error: true
        run: |
          dotnet test companion/Biza.SupportCompanion.sln --no-build --configuration Release --filter "FullyQualifiedName~SupportProtocolTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=results-protocol.trx" 2>&1 | Tee-Object -FilePath test-output-protocol.txt
          exit $LASTEXITCODE
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Test class OfflineTokenVerifier
        id: verifier
        continue-on-error: true
        run: |
          dotnet test companion/Biza.SupportCompanion.sln --no-build --configuration Release --filter "FullyQualifiedName~OfflineTokenVerifierTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=results-verifier.trx" 2>&1 | Tee-Object -FilePath test-output-verifier.txt
          exit $LASTEXITCODE
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Test class Dpapi
        id: dpapi
        continue-on-error: true
        run: |
          dotnet test companion/Biza.SupportCompanion.sln --no-build --configuration Release --filter "FullyQualifiedName~DpapiTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=results-dpapi.trx" 2>&1 | Tee-Object -FilePath test-output-dpapi.txt
          exit $LASTEXITCODE
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Test class MaintenanceLock
        id: lock
        continue-on-error: true
        run: |
          dotnet test companion/Biza.SupportCompanion.sln --no-build --configuration Release --filter "FullyQualifiedName~MaintenanceLockTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=results-lock.trx" 2>&1 | Tee-Object -FilePath test-output-lock.txt
          exit $LASTEXITCODE
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Test class Redactor
        id: redactor
        continue-on-error: true
        run: |
          dotnet test companion/Biza.SupportCompanion.sln --no-build --configuration Release --filter "FullyQualifiedName~RedactorTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=results-redactor.trx" 2>&1 | Tee-Object -FilePath test-output-redactor.txt
          exit $LASTEXITCODE
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Verdict
        if: always()
        run: |
          $names = @('paths', 'protocol', 'verifier', 'dpapi', 'lock', 'redactor')
          $vals = @('${{ steps.paths.outcome }}', '${{ steps.protocol.outcome }}', '${{ steps.verifier.outcome }}', '${{ steps.dpapi.outcome }}', '${{ steps.lock.outcome }}', '${{ steps.redactor.outcome }}')
          $report = for ($i = 0; $i -lt $names.Count; $i++) { "$($names[$i])=$($vals[$i])" }
          if ($vals -contains 'failure') {
            Write-Host "::error title=class outcomes::$($report -join ', ')"
            exit 1
          }

      # dotnet-test failures do not surface as check annotations on their own,
      # so a red run would otherwise say only "exit code 1". The TRX logger
      # records the structured per-test outcome (including run aborts), which
      # this step re-emits as annotations readable from the checks API.
      # TEMPORARY: minimal reporter — the full dump keeps losing messages, so
      # report ONLY the failing verifier class until it is green.
      - name: Report verifier failure
        if: always()
        run: |
          try {
            Write-Host "::error title=v::verifier outcome is ${{ steps.verifier.outcome }}"
            Write-Host "::error title=v::console present $(Test-Path test-output-verifier.txt)"
            $vtrx = 'companion/test/Biza.SupportCompanion.Core.Tests/TestResults/results-verifier.trx'
            Write-Host "::error title=v::trx present $(Test-Path $vtrx)"
            if (Test-Path $vtrx) {
              [xml]$trx = Get-Content $vtrx
              $c = $trx.TestRun.ResultSummary.Counters
              Write-Host "::error title=v::trx outcome=$($trx.TestRun.ResultSummary.outcome) total=$($c.total) passed=$($c.passed) failed=$($c.failed) error=$($c.error)"
              foreach ($r in $trx.TestRun.Results.UnitTestResult) {
                if ($r.outcome -eq 'Passed') { continue }
                $m = ''
                if ($r.Output -and $r.Output.ErrorInfo -and $r.Output.ErrorInfo.Message) {
                  $m = ($r.Output.ErrorInfo.Message -replace '\s+', ' ').Trim()
                }
                if ($m.Length -gt 600) { $m = $m.Substring(0, 600) }
                Write-Host "::error title=v $($r.outcome)::$($r.testName) :: $m"
              }
            }
            if (Test-Path test-output-verifier.txt) {
              $kept = @(Get-Content test-output-verifier.txt | Where-Object { $_.Trim() -ne '' -and $_.Trim() -notmatch '^Passed\s' })
              Write-Host "::error title=v::console non-pass lines $($kept.Count)"
              $buf = ''
              $n = 0
              foreach ($line in $kept) {
                $piece = ($line.Trim() -replace 'Biza\.SupportCompanion\.Core\.Tests\.', '') + ' | '
                if (($buf.Length + $piece.Length) -gt 800) {
                  $n++
                  Write-Host "::error title=v console ($n)::$buf"
                  $buf = ''
                }
                $buf += $piece
              }
              if ($buf -ne '') {
                $n++
                Write-Host "::error title=v console ($n)::$buf"
              }
            }
            Write-Host "::error title=v::reporter finished"
          } catch {
            Write-Host "::error title=v reporter crashed::$($_.Exception.Message)"
          }
