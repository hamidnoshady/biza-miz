# Issue #984 — the standalone Windows support companion (.NET 10).
#
# Builds and tests companion/ on GitHub-hosted Windows runners. The companion
# is the one native component in the repo, so it gets its own workflow rather
# than a job in test.yml: its toolchain (dotnet SDK, NuGet restore, DPAPI and
# file-lock tests that only pass on real Windows) shares nothing with the
# Node suite. Triggers mirror test.yml (PRs plus pushes to main and Arena
# branches — GitHub suppresses Arena-App PR-synchronize events, so the push
# trigger is what actually runs on Arena PRs), narrowed by paths so unrelated
# changes do not spend Windows minutes here.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  push:
    branches: [main, 'arena/**']
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"

concurrency:
  group: companion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Windows PowerShell 5.1 — always present on Windows, unlike `pwsh`.
    shell: powershell

jobs:
  build-test:
    name: companion build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore companion/Biza.SupportCompanion.sln

      - name: Build (Release)
        run: dotnet build companion/Biza.SupportCompanion.sln --no-restore --configuration Release

      - name: Test (Release)
        run: |
          dotnet test companion/Biza.SupportCompanion.sln --no-build --configuration Release --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath test-output.txt
          exit $LASTEXITCODE
        env:
          # Lets the xUnit test host roll forward onto the .NET 10 runtime
          # when the pinned Test SDK predates it. Test-only; the shipped
          # companion targets its runtime exactly.
          DOTNET_ROLL_FORWARD: Major

      # dotnet-test failures do not surface as check annotations on their own,
      # so a red run would otherwise say only "exit code 1". Re-emit each
      # failed test (plus its assertion message) as an error annotation, which
      # is readable from the checks API without log access.
      - name: Surface test failures as annotations
        if: failure()
        run: |
          $lines = Get-Content test-output.txt
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^Failed\s+(\S+)') {
              $name = $Matches[1]
              $detail = @()
              for ($j = $i + 1; $j -lt [Math]::Min($i + 9, $lines.Count); $j++) {
                if ($lines[$j] -match '^\s*Stack Trace:') { break }
                $detail += $lines[$j].Trim()
              }
              $message = (($detail -join ' ') -replace '\s+', ' ').Trim()
              if ($message.Length -gt 900) { $message = $message.Substring(0, 900) }
              Write-Host "::error title=Test failed: $name::$message"
            }
          }
