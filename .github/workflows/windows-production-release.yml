name: windows-production-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Production version (X.Y.Z)'
        type: string
        required: true
      candidate_commit:
        description: 'Full release-candidate Git commit SHA'
        type: string
        required: true
      candidate_run_id:
        description: 'Successful windows-signed-candidate run id'
        type: string
        required: true
      acceptance_run_id:
        description: 'Successful release-acceptance-aggregate run id for this exact candidate'
        type: string
        required: true
      channel:
        description: 'Channel embedded by the signed-candidate run'
        type: choice
        options: [stable, beta, internal]
        default: stable
        required: true
      minimum_supported_version:
        description: 'Oldest Desktop SemVer eligible for an in-place update'
        type: string
        required: true
      migration_version:
        description: 'Highest database migration number in this package'
        type: string
        required: true
      release_notes:
        description: 'Short release note (additional notes can be added in the registry)'
        type: string
        required: true

concurrency:
  group: windows-production-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: powershell

env:
  RELEASE_VERSION: ${{ inputs.version }}
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  MINIMUM_SUPPORTED_VERSION: ${{ inputs.minimum_supported_version }}
  MIGRATION_VERSION: ${{ inputs.migration_version }}
  WINDOWS_EXPECTED_SIGNER: ${{ vars.WINDOWS_EXPECTED_SIGNER }}
  DESKTOP_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DESKTOP_RELEASE_PUBLIC_KEY_PEM }}

jobs:
  promote:
    name: promote the accepted signed candidate without rebuilding
    runs-on: windows-latest
    timeout-minutes: 30
    environment: windows-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate immutable promotion inputs
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be X.Y.Z' }
          if ($env:CANDIDATE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'candidate_commit must be a full Git SHA' }
          if ($env:CANDIDATE_RUN_ID -notmatch '^\d+$') { throw 'candidate_run_id must be a workflow run id' }
          if ($env:ACCEPTANCE_RUN_ID -notmatch '^\d+$') { throw 'acceptance_run_id must be a workflow run id' }
          if ($env:RELEASE_CHANNEL -notin @('stable','beta','internal')) { throw 'Unsupported release channel' }
          if ($env:MINIMUM_SUPPORTED_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'minimum_supported_version must be SemVer' }
          if ($env:MIGRATION_VERSION -notmatch '^\d+$' -or [int]$env:MIGRATION_VERSION -lt 1) { throw 'migration_version must be a positive integer' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_EXPECTED_SIGNER)) { throw 'NOT CONFIGURED: WINDOWS_EXPECTED_SIGNER' }
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_RELEASE_PUBLIC_KEY_PEM)) { throw 'NOT CONFIGURED: DESKTOP_RELEASE_PUBLIC_KEY_PEM' }
          if ($env:WORKFLOW_COMMIT -cne $env:CANDIDATE_COMMIT) { throw "Workflow definition commit $env:WORKFLOW_COMMIT does not match candidate $env:CANDIDATE_COMMIT" }
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOutCommit -cne $env:CANDIDATE_COMMIT) { throw "Checked-out commit $checkedOutCommit does not match candidate $env:CANDIDATE_COMMIT" }

      - name: Require successful authoritative source workflows
        env:
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:ACTIONS_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $candidateRun = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" -Headers $headers
          $acceptanceRun = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:ACCEPTANCE_RUN_ID" -Headers $headers
          if ($candidateRun.name -cne 'windows-signed-candidate' -or $candidateRun.event -cne 'workflow_dispatch' -or $candidateRun.conclusion -cne 'success') { throw 'candidate_run_id is not a successful windows-signed-candidate dispatch' }
          if ($acceptanceRun.name -cne 'release-acceptance-aggregate' -or $acceptanceRun.event -cne 'workflow_dispatch' -or $acceptanceRun.conclusion -cne 'success') { throw 'acceptance_run_id is not a successful release-acceptance-aggregate dispatch' }
          if ($candidateRun.head_sha -cne $env:CANDIDATE_COMMIT) { throw "Signed-candidate workflow definition came from $($candidateRun.head_sha), not $env:CANDIDATE_COMMIT" }
          if ($acceptanceRun.head_sha -cne $env:CANDIDATE_COMMIT) { throw "Acceptance workflow definition came from $($acceptanceRun.head_sha), not $env:CANDIDATE_COMMIT" }

      - name: Download the previously built signed candidate
        uses: actions/download-artifact@v8
        with:
          name: business-suite-windows-${{ inputs.version }}-signed-candidate
          path: ${{ runner.temp }}\signed-candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download candidate-bound external acceptance
        uses: actions/download-artifact@v8
        with:
          name: release-acceptance-evidence-${{ inputs.version }}
          path: ${{ runner.temp }}\acceptance
          repository: ${{ github.repository }}
          run-id: ${{ inputs.acceptance_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate provenance, reports and the exact signed installer
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}\signed-candidate
        run: |
          $ErrorActionPreference = 'Stop'
          function Require-One([string]$filter) {
            $matches = @(Get-ChildItem $env:CANDIDATE_ROOT -Recurse -File -Filter $filter)
            if ($matches.Count -ne 1) { throw "Expected exactly one $filter in the signed candidate; found $($matches.Count)" }
            return $matches[0]
          }

          $installer = Require-One 'Business Suite Setup *.exe'
          $provenanceFile = Require-One 'release-provenance.json'
          $signingStatusFile = Require-One 'windows-signing-status.json'
          $signatureVerificationFile = Require-One 'windows-signature-verification.json'
          $candidateEvidenceFile = Require-One 'release-evidence.json'
          $candidateReadinessFile = Require-One 'release-readiness.json'
          $null = Require-One 'packaged-electron-runtime.json'
          $null = Require-One 'packaged-pg-tools-acceptance.json'
          $null = Require-One 'packaged-restore-acceptance.json'
          $null = Require-One 'windows-size-gate.json'

          $provenance = Get-Content $provenanceFile.FullName -Raw | ConvertFrom-Json
          $signingStatus = Get-Content $signingStatusFile.FullName -Raw | ConvertFrom-Json
          $signatureVerification = Get-Content $signatureVerificationFile.FullName -Raw | ConvertFrom-Json
          $candidateEvidence = Get-Content $candidateEvidenceFile.FullName -Raw | ConvertFrom-Json
          $candidateReadiness = Get-Content $candidateReadinessFile.FullName -Raw | ConvertFrom-Json

          if ($provenance.version -cne $env:RELEASE_VERSION -or $provenance.commit -cne $env:CANDIDATE_COMMIT -or $provenance.channel -cne $env:RELEASE_CHANNEL) { throw 'Release provenance is not for the requested version, channel and candidate' }
          $currentKey = $env:DESKTOP_RELEASE_PUBLIC_KEY_PEM.Replace('\\n', "`n").Trim()
          $currentKeyFile = Join-Path $env:RUNNER_TEMP 'desktop-release-public-key.pem'
          [IO.File]::WriteAllText($currentKeyFile, "$currentKey`n", [Text.UTF8Encoding]::new($false))
          $currentKeyHash = (Get-FileHash $currentKeyFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($provenance.releaseManifestPublicKeySha256 -cne $currentKeyHash) { throw 'Accepted installer embeds a different release-manifest public key' }
          $expectedName = "Business Suite Setup $env:RELEASE_VERSION.exe"
          if ($installer.Name -cne $expectedName) { throw "Installer $($installer.Name) does not match $expectedName" }
          $artifactRows = @($provenance.artifacts | Where-Object { $_.name -ceq $installer.Name })
          if ($artifactRows.Count -ne 1) { throw 'Release provenance has no unique installer row' }
          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($artifactRows[0].sha256 -cne $installerHash -or [long]($artifactRows[0].bytes) -ne $installer.Length) { throw 'Installer bytes do not match release provenance' }

          $statusHash = (Get-FileHash -LiteralPath $signingStatusFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $verificationHash = (Get-FileHash -LiteralPath $signatureVerificationFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($provenance.signingStatusSha256 -cne $statusHash -or $provenance.signatureVerificationSha256 -cne $verificationHash) { throw 'Signing reports do not match release provenance' }
          if ($signingStatus.commit -cne $env:CANDIDATE_COMMIT -or $signingStatus.status -cne 'SIGNED - VERIFICATION REQUIRED') { throw 'Signing status is not bound to this candidate' }
          if (-not $signatureVerification.passed -or $signatureVerification.mode -cne 'signed' -or $signatureVerification.commit -cne $env:CANDIDATE_COMMIT) { throw 'Original signature verification is not a candidate-bound PASS' }
          $verifiedInstaller = @($signatureVerification.artifacts | Where-Object id -eq 'nsis-installer')
          if ($verifiedInstaller.Count -ne 1 -or $verifiedInstaller[0].sha256 -cne $installerHash -or [long]($verifiedInstaller[0].bytes) -ne $installer.Length) { throw 'Originally verified installer does not match the promotion installer' }

          if ($candidateEvidence.version -cne $env:RELEASE_VERSION -or $candidateEvidence.commit -cne $env:CANDIDATE_COMMIT) { throw 'Candidate evidence envelope is not bound to this release' }
          foreach ($id in @('automated-core','postgresql-tools','authenticode')) {
            $item = $candidateEvidence.checks.$id
            if (-not $item -or $item.status -cne 'PASS' -or $item.commit -cne $env:CANDIDATE_COMMIT) { throw "Candidate internal check $id is not a candidate-bound PASS" }
            if ($id -eq 'authenticode' -and ($item.version -cne $env:RELEASE_VERSION -or $item.installerSha256 -cne $installerHash)) { throw 'Authenticode evidence is not bound to this version and installer' }
          }
          if ($candidateReadiness.productionEligible -or $candidateReadiness.commit -cne $env:CANDIDATE_COMMIT -or $candidateReadiness.version -cne $env:RELEASE_VERSION -or $candidateReadiness.installerSha256 -cne $installerHash) { throw 'Signed-candidate readiness has an invalid scope or eligibility claim' }

          $preflightRoot = Join-Path $env:RUNNER_TEMP 'promotion-signature-preflight'
          New-Item -ItemType Directory -Path $preflightRoot -Force | Out-Null
          Copy-Item -LiteralPath $installer.FullName -Destination $preflightRoot
          .\scripts\verify-windows-signatures.ps1 -ArtifactRoot $preflightRoot -ManifestPath config\windows-installer-signing-manifest.json -Mode signed -ExpectedSigner $env:WINDOWS_EXPECTED_SIGNER -CandidateCommit $env:CANDIDATE_COMMIT -OutputPath promotion-installer-signatures.json
          "PROMOTION_INSTALLER_SHA256=$installerHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_EVIDENCE_FILE=$($candidateEvidenceFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_PROVENANCE_FILE=$($provenanceFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bind aggregate evidence to the exact installer and candidate
        env:
          ACCEPTANCE_FILE: ${{ runner.temp }}\acceptance\release-acceptance-evidence.json
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:ACCEPTANCE_FILE)) { throw 'Aggregated acceptance evidence is missing' }
          $aggregate = Get-Content -LiteralPath $env:ACCEPTANCE_FILE -Raw | ConvertFrom-Json
          if ($aggregate.version -cne $env:RELEASE_VERSION -or $aggregate.commit -cne $env:CANDIDATE_COMMIT) { throw 'Acceptance aggregate is not bound to this release' }
          foreach ($id in @('windows-server-package','windows-11-retail','physical-printer','android-real-device','ios-real-device')) {
            $item = $aggregate.checks.$id
            if (-not $item -or $item.status -cne 'PASS' -or $item.commit -cne $env:CANDIDATE_COMMIT) { throw "Acceptance check $id is not a candidate-bound PASS" }
          }
          if ($aggregate.checks.'windows-11-retail'.version -cne $env:RELEASE_VERSION) { throw 'Retail Windows 11 evidence is not bound to this version' }
          if ($aggregate.installerSha256 -cne $env:PROMOTION_INSTALLER_SHA256 -or $aggregate.checks.'windows-11-retail'.installerSha256 -cne $env:PROMOTION_INSTALLER_SHA256) { throw 'Retail Windows 11 acceptance was not executed against this exact installer' }

      - name: Generate final production readiness
        env:
          ACCEPTANCE_FILE: ${{ runner.temp }}\acceptance\release-acceptance-evidence.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CANDIDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.candidate_run_id }}
          ACCEPTANCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.acceptance_run_id }}
        run: |
          $internal = Get-Content -LiteralPath $env:CANDIDATE_EVIDENCE_FILE -Raw | ConvertFrom-Json
          $aggregate = Get-Content -LiteralPath $env:ACCEPTANCE_FILE -Raw | ConvertFrom-Json
          $checks = [ordered]@{}
          foreach ($property in $aggregate.checks.PSObject.Properties) { $checks[$property.Name] = $property.Value }
          foreach ($id in @('automated-core','postgresql-tools','authenticode')) { $checks[$id] = $internal.checks.$id }
          [ordered]@{ schemaVersion=1; version=$env:RELEASE_VERSION; commit=$env:CANDIDATE_COMMIT; installerSha256=$env:PROMOTION_INSTALLER_SHA256; checks=$checks } | ConvertTo-Json -Depth 14 | Set-Content release-evidence.json -Encoding UTF8
          node scripts/generate-release-readiness.mjs --evidence=release-evidence.json --output=release-readiness.json --markdown=release-readiness.md --commit=$env:CANDIDATE_COMMIT --version=$env:RELEASE_VERSION --installer-sha256=$env:PROMOTION_INSTALLER_SHA256 --production
          $readiness = Get-Content release-readiness.json -Raw | ConvertFrom-Json
          if (-not $readiness.productionEligible -or $readiness.status -cne 'PASS') { throw 'Production readiness did not pass' }
          [ordered]@{
            schemaVersion = 1
            version = $env:RELEASE_VERSION
            commit = $env:CANDIDATE_COMMIT
            installerSha256 = $env:PROMOTION_INSTALLER_SHA256
            candidateRunId = $env:CANDIDATE_RUN_ID
            candidateRunUrl = $env:CANDIDATE_RUN_URL
            acceptanceRunId = $env:ACCEPTANCE_RUN_ID
            acceptanceRunUrl = $env:ACCEPTANCE_RUN_URL
            promotionRunUrl = $env:RUN_URL
            rebuilt = $false
            promotedAt = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json -Depth 6 | Set-Content release-promotion.json -Encoding UTF8

      - name: Generate the consumable Desktop release manifest
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}\signed-candidate
          RELEASE_NOTE: ${{ inputs.release_notes }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem $env:CANDIDATE_ROOT -Recurse -File -Filter "Business Suite Setup $env:RELEASE_VERSION.exe")
          if ($installer.Count -ne 1) { throw "Expected exactly one promoted installer" }
          $tag = if ($env:RELEASE_CHANNEL -eq 'stable') { "desktop-v$env:RELEASE_VERSION" } else { "desktop-$env:RELEASE_CHANNEL-v$env:RELEASE_VERSION" }
          $assetName = [uri]::EscapeDataString($installer[0].Name)
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$assetName"
          $manifest = [ordered]@{
            schemaVersion = 1
            channel = $env:RELEASE_CHANNEL
            version = $env:RELEASE_VERSION
            buildCommit = $env:CANDIDATE_COMMIT
            buildId = "signed-candidate-$env:CANDIDATE_RUN_ID"
            releasedAt = [DateTime]::UtcNow.ToString('o')
            minimumSupportedVersion = $env:MINIMUM_SUPPORTED_VERSION
            mandatory = $false
            installer = [ordered]@{
              url = $url
              sha256 = $env:PROMOTION_INSTALLER_SHA256
              size = $installer[0].Length
              signatureRequired = $true
              expectedPublisher = $env:WINDOWS_EXPECTED_SIGNER
            }
            database = [ordered]@{
              migrationVersion = [int]$env:MIGRATION_VERSION
              minimumSchemaVersion = 1
              maximumSchemaVersion = [int]$env:MIGRATION_VERSION
              backupRequired = $true
            }
            releaseNotes = @($env:RELEASE_NOTE)
            recovery = [ordered]@{ knownGoodVersion = $null; notes = 'Use the preserved pre-update backup; binary and database recovery are separate operator decisions.' }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content release-manifest.json -Encoding UTF8
          "DESKTOP_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_INSTALLER_PATH=$($installer[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_INSTALLER_SIZE=$($installer[0].Length)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign the release manifest and verify its embedded-package key
        env:
          DESKTOP_RELEASE_PRIVATE_KEY_PEM: ${{ secrets.DESKTOP_RELEASE_PRIVATE_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_RELEASE_PRIVATE_KEY_PEM)) { throw 'NOT CONFIGURED: DESKTOP_RELEASE_PRIVATE_KEY_PEM' }
          node scripts/sign-desktop-release-manifest.mjs release-manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'Release manifest signing failed' }
          $manifestHash = (Get-FileHash release-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "$manifestHash  release-manifest.json" | Set-Content release-manifest.sha256 -Encoding ascii

      - name: Stage the immutable accepted candidate for upload
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}\signed-candidate
          ACCEPTANCE_FILE: ${{ runner.temp }}\acceptance\release-acceptance-evidence.json
        run: |
          if (Test-Path final-release) { Remove-Item final-release -Recurse -Force }
          New-Item -ItemType Directory -Path final-release | Out-Null
          Copy-Item "$env:CANDIDATE_ROOT\*" final-release -Recurse -Force
          Copy-Item -LiteralPath $env:ACCEPTANCE_FILE -Destination final-release\release-acceptance-evidence.json
          Copy-Item release-evidence.json, release-readiness.json, release-readiness.md, release-promotion.json, promotion-installer-signatures.json, release-manifest.json, release-manifest.sha256 -Destination final-release -Force

      - name: Upload production release without changing accepted bytes
        uses: actions/upload-artifact@v7
        with:
          name: business-suite-windows-${{ inputs.version }}-signed
          if-no-files-found: error
          path: final-release/**

      - name: Publish installer and manifest to the production Desktop feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.DESKTOP_RELEASE_TAG }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (gh release view $env:TAG 2>$null) { throw "Release tag $env:TAG already exists; production promotion is immutable" }
          $args = @(
            'release','create',$env:TAG,
            $env:DESKTOP_INSTALLER_PATH,
            'release-manifest.json',
            'release-manifest.sha256',
            'release-readiness.json',
            $env:CANDIDATE_PROVENANCE_FILE,
            '--target',$env:CANDIDATE_COMMIT,
            '--title',"Business Suite Desktop $env:RELEASE_VERSION ($env:RELEASE_CHANNEL)",
            '--notes',"Accepted signed Desktop release. Installer SHA-256: $env:PROMOTION_INSTALLER_SHA256"
          )
          if ($env:RELEASE_CHANNEL -ne 'stable') { $args += '--prerelease' }
          gh @args
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }

      - name: Register the promoted release in Central
        env:
          REGISTRY_URL: ${{ vars.DESKTOP_RELEASE_REGISTRY_URL }}
          REGISTRY_TOKEN: ${{ secrets.DESKTOP_RELEASE_PUBLISH_TOKEN }}
          RELEASE_NOTE: ${{ inputs.release_notes }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:REGISTRY_URL)) { throw 'NOT CONFIGURED: DESKTOP_RELEASE_REGISTRY_URL' }
          if ([string]::IsNullOrWhiteSpace($env:REGISTRY_TOKEN)) { throw 'NOT CONFIGURED: DESKTOP_RELEASE_PUBLISH_TOKEN' }
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          $payload = [ordered]@{
            version = $manifest.version
            buildCommit = $manifest.buildCommit
            buildId = $manifest.buildId
            channel = $manifest.channel
            status = 'published'
            rolloutState = 'internal'
            rolloutPercentage = 0
            minimumSupportedVersion = $manifest.minimumSupportedVersion
            mandatory = $manifest.mandatory
            installerUrl = $manifest.installer.url
            installerSha256 = $manifest.installer.sha256
            installerSize = $manifest.installer.size
            manifestSignature = $manifest.manifestSignature
            expectedPublisher = $manifest.installer.expectedPublisher
            migrationVersion = $manifest.database.migrationVersion
            minimumSchemaVersion = $manifest.database.minimumSchemaVersion
            maximumSchemaVersion = $manifest.database.maximumSchemaVersion
            releaseNotes = @($env:RELEASE_NOTE)
            recoveryNotes = $manifest.recovery.notes
            knownGoodReleaseId = $null
          } | ConvertTo-Json -Depth 8
          Invoke-RestMethod -Method Post -Uri $env:REGISTRY_URL -Headers @{ Authorization = "Bearer $env:REGISTRY_TOKEN" } -ContentType 'application/json' -Body $payload | Out-Null
