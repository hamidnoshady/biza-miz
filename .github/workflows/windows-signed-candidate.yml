name: windows-signed-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Production version (X.Y.Z)'
        type: string
        required: true
      candidate_commit:
        description: 'Full release-candidate Git commit SHA'
        type: string
        required: true
      channel:
        description: 'Desktop release channel embedded in the signed package'
        type: choice
        options: [stable, beta, internal]
        default: stable
        required: true

concurrency:
  group: windows-signed-candidate
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

defaults:
  run:
    shell: powershell

env:
  NODE_OPTIONS: --max-old-space-size=4096
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef
  PGPORT: "55432"
  DATABASE_URL: postgres://pos:pos@127.0.0.1:55432/pos
  PRODUCTION_RELEASE: "1"
  RELEASE_VERSION: ${{ inputs.version }}
  CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
  WINDOWS_SIGNING_RUNNER_JSON: ${{ vars.WINDOWS_SIGNING_RUNNER_JSON }}
  WINDOWS_EXPECTED_SIGNER: ${{ vars.WINDOWS_EXPECTED_SIGNER }}
  DESKTOP_RELEASE_PUBLIC_KEY_PEM: ${{ vars.DESKTOP_RELEASE_PUBLIC_KEY_PEM }}
  WINDOWS_RFC3161_URL: ${{ vars.WINDOWS_RFC3161_URL }}
  PG_SOURCE_VERSION: '16.15'
  PG_SOURCE_URL: https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.gz
  PG_SOURCE_SHA256: 4f200ca23dfb120ff9838f13ce06014aad1d3c432d16ee9f93ab2000c0eeef7b
  ZLIB_SOURCE_VERSION: '1.3.2'
  ZLIB_SOURCE_URL: https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
  ZLIB_SOURCE_SHA256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
  WINDOWS_INSTALLER_BUDGET_MIB: ${{ vars.WINDOWS_INSTALLER_BUDGET_MIB }}
  WINDOWS_SIZE_EXCEPTION_REASON: ${{ vars.WINDOWS_SIZE_EXCEPTION_REASON }}
  WINDOWS_CERTIFICATE_SUBJECT: ${{ vars.WINDOWS_CERTIFICATE_SUBJECT }}
  WINDOWS_CERTIFICATE_SHA1: ${{ vars.WINDOWS_CERTIFICATE_SHA1 }}
  AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
  AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
  AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
  AZURE_USE_OIDC: ${{ vars.AZURE_USE_OIDC }}

jobs:
  release:
    name: signed Windows candidate build and verification
    # PFX and Azure providers use an ephemeral hosted runner by default. An
    # organization-controlled certificate-store/HSM runner can be selected with
    # e.g. WINDOWS_SIGNING_RUNNER_JSON=["self-hosted","Windows","X64","signing"].
    runs-on: ${{ fromJSON(vars.WINDOWS_SIGNING_RUNNER_JSON || '["windows-latest"]') }}
    timeout-minutes: 150
    environment: windows-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_commit }}

      - name: Fail closed when protected release configuration is absent
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          CSC_LINK: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'pfx' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'pfx' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && secrets.AZURE_SUBSCRIPTION_ID || '' }}
          AZURE_TENANT_ID: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && vars.AZURE_USE_OIDC != 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be X.Y.Z" }
          if ($env:CANDIDATE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw "candidate_commit must be a full Git SHA" }
          if ($env:RELEASE_CHANNEL -notin @('stable','beta','internal')) { throw "Unsupported release channel" }
          if ($env:WORKFLOW_COMMIT -cne $env:CANDIDATE_COMMIT) { throw "Workflow definition commit $env:WORKFLOW_COMMIT does not match candidate $env:CANDIDATE_COMMIT" }
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOutCommit -cne $env:CANDIDATE_COMMIT) { throw "Checked-out commit $checkedOutCommit does not match candidate $env:CANDIDATE_COMMIT" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PROVIDER)) { throw "NOT CONFIGURED: WINDOWS_SIGNING_PROVIDER" }
          if ($env:WINDOWS_SIGNING_PROVIDER -notin @('pfx','certificate-store','azure-trusted-signing')) { throw "Unsupported production WINDOWS_SIGNING_PROVIDER: $env:WINDOWS_SIGNING_PROVIDER" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_EXPECTED_SIGNER)) { throw "NOT CONFIGURED: WINDOWS_EXPECTED_SIGNER" }
          if ([string]::IsNullOrWhiteSpace($env:DESKTOP_RELEASE_PUBLIC_KEY_PEM)) { throw "NOT CONFIGURED: DESKTOP_RELEASE_PUBLIC_KEY_PEM" }
          node -e "const k=require('node:crypto').createPublicKey(process.env.DESKTOP_RELEASE_PUBLIC_KEY_PEM.replaceAll('\\n','\n'));if(!String(k.asymmetricKeyType).startsWith('rsa'))process.exit(2)"
          if ($LASTEXITCODE -ne 0) { throw "DESKTOP_RELEASE_PUBLIC_KEY_PEM is not a valid public key" }
          if ($env:WINDOWS_SIGNING_PROVIDER -eq 'pfx' -and ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD))) { throw 'NOT CONFIGURED: protected PFX signing credentials' }
          if ($env:WINDOWS_SIGNING_PROVIDER -eq 'certificate-store') {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_SUBJECT) -and [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_SHA1)) { throw 'NOT CONFIGURED: certificate-store selector' }
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_RUNNER_JSON) -or $env:WINDOWS_SIGNING_RUNNER_JSON -notmatch 'self-hosted') { throw 'NOT CONFIGURED: certificate-store signing requires WINDOWS_SIGNING_RUNNER_JSON selecting an organization-controlled self-hosted runner' }
          }
          if ($env:WINDOWS_SIGNING_PROVIDER -eq 'azure-trusted-signing') {
            foreach ($name in @('AZURE_TRUSTED_SIGNING_ENDPOINT','AZURE_TRUSTED_SIGNING_ACCOUNT','AZURE_TRUSTED_SIGNING_PROFILE','AZURE_CLIENT_ID','AZURE_TENANT_ID')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "NOT CONFIGURED: $name" }
            }
            if ($env:AZURE_USE_OIDC -eq 'true' -and [string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID)) { throw 'NOT CONFIGURED: AZURE_SUBSCRIPTION_ID for OIDC' }
            if ($env:AZURE_USE_OIDC -ne 'true' -and [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET)) { throw 'NOT CONFIGURED: AZURE_CLIENT_SECRET or set AZURE_USE_OIDC=true' }
          }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build compressed-backup PostgreSQL 16 tools from pinned official sources
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:PG_SOURCE_URL -MaximumRedirection 5 -OutFile "$env:RUNNER_TEMP\postgresql-source.tar.gz"
          Invoke-WebRequest -Uri $env:ZLIB_SOURCE_URL -MaximumRedirection 5 -OutFile "$env:RUNNER_TEMP\zlib-source.tar.gz"
          .\scripts\build-postgresql-tools-from-source.ps1 `
            -SourceArchive "$env:RUNNER_TEMP\postgresql-source.tar.gz" `
            -SourceSha256 $env:PG_SOURCE_SHA256 `
            -ZlibSourceArchive "$env:RUNNER_TEMP\zlib-source.tar.gz" `
            -ZlibSourceSha256 $env:ZLIB_SOURCE_SHA256 `
            -PostgresVersion $env:PG_SOURCE_VERSION `
            -ZlibVersion $env:ZLIB_SOURCE_VERSION `
            -OutputDirectory controlled-input `
            -Organization "${{ github.repository_owner }}"
          $result = Get-Content controlled-input\source-build.json -Raw | ConvertFrom-Json
          "PG_TOOLS_ARTIFACT_SHA256=$($result.artifactSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install, lint, typecheck and test application
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Stage pinned-source PostgreSQL 16 client tools without network fallback
        env:
          PG_TOOLS_ARCHIVE: ${{ github.workspace }}\controlled-input\postgresql-16-windows-x64-client-tools.zip
          PG_TOOLS_PROVENANCE: ${{ github.workspace }}\controlled-input\provenance.json
        run: npm run desktop:stage-pg-tools:release

      - name: Build production application and positive desktop runtime
        run: |
          npm run build
          npm run desktop:runtime

      - name: Embed protected release-manifest verification key
        run: |
          $key = $env:DESKTOP_RELEASE_PUBLIC_KEY_PEM.Replace('\\n', "`n").Trim()
          [IO.File]::WriteAllText("${{ github.workspace }}\electron\desktop-release-public-key.pem", "$key`n", [Text.UTF8Encoding]::new($false))

      - name: Install and audit Electron dependencies
        working-directory: electron
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Verify runtime requires packaged PostgreSQL tools
        working-directory: electron
        env:
          REQUIRE_PACKAGED_PG_TOOLS: "1"
        run: npm run verify:runtime

      # Keep signing authority unavailable while dependency lifecycle scripts,
      # tests and application builds execute. Only the packaging step receives
      # PFX/service-principal credentials, and OIDC login happens immediately
      # before that step rather than at the beginning of the job.
      - name: Authenticate to Azure with protected OIDC federation
        if: vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && vars.AZURE_USE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set release version and build through configured signing provider
        env:
          VERSION: ${{ inputs.version }}
          CSC_LINK: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'pfx' && secrets.WINDOWS_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'pfx' && secrets.WINDOWS_CSC_KEY_PASSWORD || '' }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && secrets.AZURE_SUBSCRIPTION_ID || '' }}
          AZURE_TENANT_ID: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && vars.AZURE_USE_OIDC != 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          npm pkg set "version=$env:VERSION" "buildCommit=$env:CANDIDATE_COMMIT" "buildId=signed-candidate-$env:GITHUB_RUN_ID" "releaseChannel=$env:RELEASE_CHANNEL" --prefix electron
          npm run dist --prefix electron

      - name: Clear transient Azure CLI signing session
        if: always() && vars.WINDOWS_SIGNING_PROVIDER == 'azure-trusted-signing' && vars.AZURE_USE_OIDC == 'true'
        continue-on-error: true
        run: |
          az logout
          az account clear

      - name: Require valid expected-signer Authenticode and RFC3161 timestamps
        run: .\scripts\verify-windows-signatures.ps1 -ArtifactRoot electron\dist -Mode signed -ExpectedSigner $env:WINDOWS_EXPECTED_SIGNER -CandidateCommit $env:CANDIDATE_COMMIT -OutputPath windows-signature-verification.json

      - name: Assert packaged Electron and Node.js support posture
        run: .\scripts\verify-packaged-electron-runtime.ps1 -ArtifactRoot electron\dist\win-unpacked -OutputPath packaged-electron-runtime.json

      - name: Start disposable PostgreSQL 16 server
        env:
          PGDATA: ${{ runner.temp }}\release-pgdata
        run: |
          if (Test-Path -LiteralPath $env:PGDATA) { Remove-Item -LiteralPath $env:PGDATA -Recurse -Force }
          npm run db:dev:start
          npm run db:migrate

      - name: Full real-database, sync, accounting and inventory suite
        run: npm run test:db

      - name: Execute actual packaged custom-format dump/restore acceptance
        env:
          PG_TOOLS_DIR: ${{ github.workspace }}\electron\dist\win-unpacked\resources\postgresql-tools
        run: node scripts/accept-packaged-pg-tools.mjs

      - name: Execute verified swap, emergency backup and rollback acceptance
        env:
          PG_TOOLS_DIR: ${{ github.workspace }}\electron\dist\win-unpacked\resources\postgresql-tools
        run: npx tsx scripts/accept-packaged-restore.ts

      - name: Focused backup/restore safety suite
        run: npx vitest run src/lib/pg-tools.test.ts src/lib/backup.test.ts src/lib/platform-backup.test.ts

      - name: Stop disposable PostgreSQL
        if: always()
        continue-on-error: true
        env:
          PGDATA: ${{ runner.temp }}\release-pgdata
        run: npm run db:dev:stop

      - name: Size budgets and component report
        run: |
          node scripts/report-desktop-size.mjs --output=desktop-size-report.md
          $installer = Get-ChildItem electron/dist -File -Filter "Business Suite Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "installer missing" }
          $installed = (Get-ChildItem electron/dist/win-unpacked -Recurse -File | Measure-Object Length -Sum).Sum
          $runtime = (Get-ChildItem .desktop-runtime -Recurse -File | Measure-Object Length -Sum).Sum
          $tools = (Get-ChildItem electron/dist/win-unpacked/resources/postgresql-tools -Recurse -File | Measure-Object Length -Sum).Sum
          $installerMiB = [math]::Round($installer.Length/1MB,1)
          $toolsMiB = [math]::Round($tools/1MB,1)
          $budgetMiB = 175
          $exception = $null
          if ($installer.Length -gt 175MB) {
            [double]$configuredBudget = 0
            if (-not [double]::TryParse($env:WINDOWS_INSTALLER_BUDGET_MIB, [ref]$configuredBudget) -or $configuredBudget -le 175 -or $configuredBudget -gt 250) {
              throw "Installer $installerMiB MiB exceeds the 175 MiB baseline and no bounded measured exception (176..250 MiB) is configured"
            }
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIZE_EXCEPTION_REASON)) {
              throw "Installer size exception requires WINDOWS_SIZE_EXCEPTION_REASON describing the measured PostgreSQL tools/signing increase"
            }
            $budgetMiB = $configuredBudget
            $exception = $env:WINDOWS_SIZE_EXCEPTION_REASON
          }
          Write-Host "::notice title=Release sizes::installer=$installerMiB MiB (budget $budgetMiB); installed=$([math]::Round($installed/1MB,1)) MiB; runtime=$([math]::Round($runtime/1MB,1)) MiB; PostgreSQL tools=$toolsMiB MiB"
          if ($installer.Length -gt ($budgetMiB * 1MB)) { throw "Installer $installerMiB MiB exceeds reviewed budget $budgetMiB MiB" }
          if ($installed -gt 600MB) { throw "Installed payload exceeds 600 MiB" }
          if ($runtime -gt 200MB) { throw "Positive runtime exceeds 200 MiB" }
          [ordered]@{
            schemaVersion = 1
            installerBytes = $installer.Length
            installerMiB = $installerMiB
            installerBaselineMiB = 175
            approvedInstallerBudgetMiB = $budgetMiB
            installedBytes = $installed
            installedMiB = [math]::Round($installed/1MB,1)
            installedBudgetMiB = 600
            runtimeBytes = $runtime
            runtimeMiB = [math]::Round($runtime/1MB,1)
            runtimeBudgetMiB = 200
            postgresqlToolsBytes = $tools
            postgresqlToolsMiB = $toolsMiB
            exceptionReason = $exception
          } | ConvertTo-Json | Set-Content windows-size-gate.json -Encoding UTF8

      - name: Generate release checksums and provenance
        run: |
          $files = @(Get-ChildItem electron/dist -File -Filter *.exe)
          if ($files.Count -ne 1) { throw "Expected exactly one release installer; found $($files.Count)" }
          $rows = @($files | ForEach-Object {
            [ordered]@{ name = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $runtime = Get-Content packaged-electron-runtime.json -Raw | ConvertFrom-Json
          $signingStatus = Get-Content electron\dist\windows-signing-status.json -Raw | ConvertFrom-Json
          $signatureVerification = Get-Content windows-signature-verification.json -Raw | ConvertFrom-Json
          if ($signingStatus.commit -cne $env:CANDIDATE_COMMIT -or $signingStatus.provider -cne $env:WINDOWS_SIGNING_PROVIDER) { throw "Signing status is not bound to this candidate/provider" }
          if ($signingStatus.status -cne 'SIGNED - VERIFICATION REQUIRED') { throw "Signing hook did not record a signed candidate" }
          if (-not $signatureVerification.passed -or $signatureVerification.mode -cne 'signed' -or $signatureVerification.commit -cne $env:CANDIDATE_COMMIT) { throw "Signature verification report is not a passing result for this candidate" }
          $verifiedInstaller = @($signatureVerification.artifacts | Where-Object id -eq 'nsis-installer')
          if ($verifiedInstaller.Count -ne 1 -or $verifiedInstaller[0].sha256 -cne $rows[0].sha256 -or [long]($verifiedInstaller[0].bytes) -ne [long]($rows[0].bytes)) { throw "Verified installer does not match release provenance" }
          [ordered]@{
            schemaVersion = 1
            version = $env:RELEASE_VERSION
            commit = $env:CANDIDATE_COMMIT
            channel = $env:RELEASE_CHANNEL
            buildId = "signed-candidate-$env:GITHUB_RUN_ID"
            signingProvider = $env:WINDOWS_SIGNING_PROVIDER
            expectedSigner = $env:WINDOWS_EXPECTED_SIGNER
            releaseManifestPublicKeySha256 = (Get-FileHash electron\desktop-release-public-key.pem -Algorithm SHA256).Hash.ToLowerInvariant()
            signingStatusSha256 = (Get-FileHash electron\dist\windows-signing-status.json -Algorithm SHA256).Hash.ToLowerInvariant()
            signatureVerificationSha256 = (Get-FileHash windows-signature-verification.json -Algorithm SHA256).Hash.ToLowerInvariant()
            postgresqlToolsSource = "postgresql-$env:PG_SOURCE_VERSION.tar.gz"
            postgresqlToolsSourceSha256 = $env:PG_SOURCE_SHA256
            postgresqlToolsCompression = "gzip"
            zlibSource = "zlib-$env:ZLIB_SOURCE_VERSION.tar.gz"
            zlibSourceSha256 = $env:ZLIB_SOURCE_SHA256
            postgresqlToolsArtifactSha256 = $env:PG_TOOLS_ARTIFACT_SHA256
            desktopRuntime = @{ electron=$runtime.electron; node=$runtime.node; chromium=$runtime.chromium }
            generatedAt = [DateTime]::UtcNow.ToString("o")
            artifacts = $rows
          } | ConvertTo-Json -Depth 6 | Set-Content release-provenance.json -Encoding UTF8

      - name: Generate signed-candidate readiness without claiming production eligibility
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $now = [DateTime]::UtcNow.ToString("o")
          $provenance = Get-Content release-provenance.json -Raw | ConvertFrom-Json
          $installer = @($provenance.artifacts | Where-Object { $_.name -ceq "Business Suite Setup $env:RELEASE_VERSION.exe" })
          if ($installer.Count -ne 1 -or $installer[0].sha256 -notmatch '^[0-9a-f]{64}$') { throw "Release provenance has no valid installer SHA-256" }
          $installerSha256 = $installer[0].sha256
          $checks = [ordered]@{}
          $checks["automated-core"] = @{ configured=$true; status="PASS"; version=$env:RELEASE_VERSION; commit=$env:CANDIDATE_COMMIT; executedAt=$now; evidenceUrl=$env:RUN_URL; platform="GitHub Windows Server runner" }
          $checks["postgresql-tools"] = @{ configured=$true; status="PASS"; version=$env:RELEASE_VERSION; commit=$env:CANDIDATE_COMMIT; executedAt=$now; evidenceUrl=$env:RUN_URL; platform="Packaged Windows x64 tools" }
          $checks["authenticode"] = @{ configured=$true; status="PASS"; version=$env:RELEASE_VERSION; commit=$env:CANDIDATE_COMMIT; installerSha256=$installerSha256; executedAt=$now; evidenceUrl=$env:RUN_URL; platform="Windows Authenticode" }
          @{ schemaVersion=1; version=$env:RELEASE_VERSION; commit=$env:CANDIDATE_COMMIT; installerSha256=$installerSha256; checks=$checks } | ConvertTo-Json -Depth 12 | Set-Content release-evidence.json -Encoding UTF8
          node scripts/generate-release-readiness.mjs --evidence=release-evidence.json --output=release-readiness.json --markdown=release-readiness.md --commit=$env:CANDIDATE_COMMIT --version=$env:RELEASE_VERSION --installer-sha256=$installerSha256
          $readiness = Get-Content release-readiness.json -Raw | ConvertFrom-Json
          if ($readiness.productionEligible -or $readiness.status -cne 'FAIL') { throw "A signed candidate cannot be production eligible before external acceptance" }
          if ($readiness.commit -cne $env:CANDIDATE_COMMIT -or $readiness.version -cne $env:RELEASE_VERSION -or $readiness.installerSha256 -cne $installerSha256) { throw "Signed-candidate readiness is not bound to this commit, version and installer" }

      - name: Upload verified signed candidate for external acceptance
        uses: actions/upload-artifact@v7
        with:
          name: business-suite-windows-${{ inputs.version }}-signed-candidate
          if-no-files-found: error
          path: |
            electron/dist/Business Suite Setup *.exe
            electron/dist/windows-signing-status.json
            windows-signature-verification.json
            packaged-electron-runtime.json
            packaged-pg-tools-acceptance.json
            packaged-restore-acceptance.json
            controlled-input/source-build.json
            controlled-input/provenance.json
            release-provenance.json
            release-evidence.json
            release-readiness.json
            release-readiness.md
            desktop-size-report.md
            windows-size-gate.json

      - name: Upload candidate-build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: business-suite-windows-${{ inputs.version }}-candidate-build-failure
          if-no-files-found: warn
          path: |
            electron/dist/Business Suite Setup *.exe
            electron/dist/windows-signing-status.json
            windows-signature-verification.json
            packaged-electron-runtime.json
            packaged-pg-tools-acceptance.json
            packaged-restore-acceptance.json
            controlled-input/source-build.json
            controlled-input/provenance.json
            release-provenance.json
            release-readiness.json
            release-readiness.md
            desktop-size-report.md
            windows-size-gate.json
