name: build-desktop-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (X.Y.Z); empty = next patch after electron/package.json'
        type: string
        required: false
  pull_request:
    paths:
      - 'electron/**'
      # The packaged desktop ships the web app, so app-source changes rebuild
      # the installer — but test files never ship, so test-only changes don't.
      # Order matters: later patterns override, so the three posture tests this
      # workflow actually executes are re-included after the exclusion.
      - 'src/**'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - 'src/lib/desktop-runtime-posture.test.ts'
      - 'src/lib/desktop-network-interfaces.test.ts'
      - 'src/lib/chromium-executable.test.ts'
      - 'public/**'
      - 'migrations/**'
      - 'scripts/build-desktop-runtime.mjs'
      - 'scripts/build-postgresql-tools-from-source.ps1'
      - 'scripts/stage-postgresql-tools.mjs'
      - 'scripts/accept-packaged-pg-tools.mjs'
      - 'scripts/accept-packaged-restore.ts'
      - 'scripts/report-desktop-size.mjs'
      - 'scripts/verify-packaged-electron-runtime.ps1'
      - 'scripts/verify-windows-signatures.ps1'
      - 'config/windows-signing-manifest.json'
      - 'scripts/desktop/**'
      - 'server.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-desktop-installer.yml'
  # Arena agent branches use a GitHub App whose PR-synchronize events may be
  # suppressed by GitHub. Run on those pushes as well so a Windows package is
  # still tested at the exact review commit. Keep the push and PR executions
  # independent: a cancelled duplicate remains on the commit status rollup.
  push:
    branches: [main, 'arena/**']
    paths:
      - 'electron/**'
      # Same app-ships-in-installer rule as the pull_request trigger above:
      # rebuild on real app changes, skip test-only changes, keep the three
      # executed posture tests as triggers.
      - 'src/**'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - 'src/lib/desktop-runtime-posture.test.ts'
      - 'src/lib/desktop-network-interfaces.test.ts'
      - 'src/lib/chromium-executable.test.ts'
      - 'public/**'
      - 'migrations/**'
      - 'scripts/build-desktop-runtime.mjs'
      - 'scripts/build-postgresql-tools-from-source.ps1'
      - 'scripts/stage-postgresql-tools.mjs'
      - 'scripts/accept-packaged-pg-tools.mjs'
      - 'scripts/accept-packaged-restore.ts'
      - 'scripts/report-desktop-size.mjs'
      - 'scripts/verify-packaged-electron-runtime.ps1'
      - 'scripts/verify-windows-signatures.ps1'
      - 'config/windows-signing-manifest.json'
      - 'scripts/desktop/**'
      - 'server.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-desktop-installer.yml'

concurrency:
  group: build-desktop-installer-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

defaults:
  run:
    shell: powershell

env:
  NODE_OPTIONS: --max-old-space-size=4096
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef
  PG_SOURCE_VERSION: '16.15'
  PG_SOURCE_URL: https://ftp.postgresql.org/pub/source/v16.15/postgresql-16.15.tar.gz
  PG_SOURCE_SHA256: 4f200ca23dfb120ff9838f13ce06014aad1d3c432d16ee9f93ab2000c0eeef7b
  ZLIB_SOURCE_VERSION: '1.3.2'
  ZLIB_SOURCE_URL: https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
  ZLIB_SOURCE_SHA256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
  PGPORT: '55432'
  DATABASE_URL: postgres://pos:pos@127.0.0.1:55432/pos
  # PR/branch artifacts are deliberately unsigned and are never release eligible.
  WINDOWS_SIGNING_PROVIDER: unsigned

jobs:
  build:
    name: packaged Windows end-to-end
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Every build gets its own version, so an installed desktop can always
      # tell two builds apart and the updater (strict SemVer "newer than
      # installed") never treats a new build as the one already installed.
      #   - main pushes and manual runs: the next patch (or the typed version);
      #     the `release-version` job commits it and tags desktop-vX.Y.Z.
      #   - PR / arena runs: that next patch as a prerelease, X.Y.Z-ci.<run>.
      #     SemVer orders it *below* X.Y.Z, so the real release still updates it.
      - name: Compute installer version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        run: |
          $ErrorActionPreference = "Stop"
          function Add-GitHubOutput([string]$line) {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$line`n", (New-Object System.Text.UTF8Encoding($false)))
          }
          $current = (Get-Content electron/package.json -Raw | ConvertFrom-Json).version
          if ($current -notmatch '^(\d+)\.(\d+)\.(\d+)$') { throw "electron/package.json version '$current' is not X.Y.Z" }
          $next = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          if ($env:INPUT_VERSION) { $next = $env:INPUT_VERSION.Trim() }
          if ($next -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be X.Y.Z, got '$next'" }

          # Ask with `git tag --list` (exit 0 either way) and end the step with
          # an explicit exit - see build-plugin-zip.yml for why a probe's exit
          # code must never decide a step.
          $ErrorActionPreference = "Continue"
          git fetch --tags --force --quiet
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Could not fetch tags"; exit 1 }
          # Only releases consume desktop-vX.Y.Z. A stale PR/arena branch may
          # propose the same base as an already-shipped stable version, but its
          # actual X.Y.Z-ci.<run> preview is distinct and never publishes a tag.
          if ($env:RELEASE_BUILD -eq "true" -and (git tag --list "desktop-v$next")) {
            Write-Host "::error::desktop-v$next already exists - a shipped version is never rebuilt. Bump electron/package.json or pass a higher version."
            exit 1
          }

          $version = if ($env:RELEASE_BUILD -eq "true") { $next } else { "$next-ci.$env:GITHUB_RUN_NUMBER" }
          npm pkg set "version=$version" --prefix electron
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Add-GitHubOutput "version=$version"
          Add-GitHubOutput "release=$env:RELEASE_BUILD"
          Write-Host "::notice title=Desktop version::$current -> $version"
          exit 0

      - name: Embed Desktop build provenance
        run: npm pkg set "buildCommit=$env:GITHUB_SHA" "buildId=ci-$env:GITHUB_RUN_ID" "releaseChannel=internal" --prefix electron

      - name: Install application dependencies
        run: npm ci

      - name: Build compressed-backup PostgreSQL 16 tools from pinned official sources
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri $env:PG_SOURCE_URL -MaximumRedirection 5 -OutFile "$env:RUNNER_TEMP\postgresql-source.tar.gz"
          Invoke-WebRequest -Uri $env:ZLIB_SOURCE_URL -MaximumRedirection 5 -OutFile "$env:RUNNER_TEMP\zlib-source.tar.gz"
          .\scripts\build-postgresql-tools-from-source.ps1 `
            -SourceArchive "$env:RUNNER_TEMP\postgresql-source.tar.gz" `
            -SourceSha256 $env:PG_SOURCE_SHA256 `
            -ZlibSourceArchive "$env:RUNNER_TEMP\zlib-source.tar.gz" `
            -ZlibSourceSha256 $env:ZLIB_SOURCE_SHA256 `
            -PostgresVersion $env:PG_SOURCE_VERSION `
            -ZlibVersion $env:ZLIB_SOURCE_VERSION `
            -OutputDirectory controlled-input `
            -Organization "${{ github.repository_owner }}"
          $result = Get-Content controlled-input\source-build.json -Raw | ConvertFrom-Json
          "PG_TOOLS_ARTIFACT_SHA256=$($result.artifactSha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage verified PostgreSQL tools without runtime network fallback
        env:
          PG_TOOLS_ARCHIVE: ${{ github.workspace }}\controlled-input\postgresql-16-windows-x64-client-tools.zip
          PG_TOOLS_PROVENANCE: ${{ github.workspace }}\controlled-input\provenance.json
        run: npm run desktop:stage-pg-tools:release

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Security posture unit tests
        run: npx vitest run src/lib/desktop-runtime-posture.test.ts src/lib/desktop-network-interfaces.test.ts src/lib/chromium-executable.test.ts

      - name: Build Next production application
        run: npm run build

      - name: Build positively selected desktop runtime
        run: npm run desktop:runtime

      - name: Install Electron production/build dependencies
        working-directory: electron
        run: npm ci

      - name: Audit Electron production dependencies
        working-directory: electron
        run: npm audit --omit=dev --audit-level=high

      - name: Verify staged runtime and canonical icon
        working-directory: electron
        run: npm run verify:runtime

      - name: Pre-package size report
        run: node scripts/report-desktop-size.mjs --output=desktop-size-before-package.md

      - name: Build NSIS installer and win-unpacked runtime
        working-directory: electron
        run: |
          & $env:ComSpec /d /c "npm run dist > electron-builder.log 2>&1"
          $buildExit = $LASTEXITCODE
          Get-Content electron-builder.log
          if ($buildExit -ne 0) {
            $tail = Get-Content electron-builder.log -Tail 120
            $summary = "## Electron installer build failure`n`n``````text`n$($tail -join "`n")`n```````n"
            [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary, (New-Object System.Text.UTF8Encoding($false)))
            # \u2a2f is the multiplication-X marker (U+2A2F) that build tools
            # print for errors - written as an escape because Windows
            # PowerShell 5.1 reads this BOM-less UTF-8 script as Windows-1252,
            # which would silently garble a literal character into one that
            # never matches anything.
            $important = $tail | Where-Object { $_ -match '(error|failed|ERR_|\u2a2f|invalid|cannot|exception)' } | Select-Object -Last 8
            foreach ($line in $important) {
              $escaped = ([string]$line).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error file=electron/package.json,title=Electron installer build failed::$escaped"
            }
            exit $buildExit
          }

      - name: Upload Electron builder diagnostics
        # Only when electron-builder actually ran; a failure in an earlier step
        # has no log, and "no files found" would bury the real error.
        if: failure() && hashFiles('electron/electron-builder.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: electron-builder-failure-log
          path: electron/electron-builder.log
          if-no-files-found: error

      - name: Verify explicit unsigned-development status
        run: .\scripts\verify-windows-signatures.ps1 -ArtifactRoot electron\dist -Mode unsigned-development -OutputPath windows-signature-verification.json

      - name: Assert packaged Electron and Node.js support posture
        run: .\scripts\verify-packaged-electron-runtime.ps1 -ArtifactRoot electron\dist\win-unpacked -OutputPath packaged-electron-runtime.json

      - name: Assert one Windows PostgreSQL payload and no foreign payload
        run: |
          function Stop-ShapeCheck([string]$Message) {
            Write-Host "::error title=Packaged desktop shape::$Message"
            throw $Message
          }
          $root = "electron/dist/win-unpacked"
          $postgres = @(Get-ChildItem $root -Recurse -File -Filter postgres.exe)
          $initdb = @(Get-ChildItem $root -Recurse -File -Filter initdb.exe)
          if ($postgres.Count -ne 1) { Stop-ShapeCheck "Expected exactly one postgres.exe, found $($postgres.Count): $($postgres.FullName -join ', ')" }
          if ($initdb.Count -ne 1) { Stop-ShapeCheck "Expected exactly one initdb.exe, found $($initdb.Count): $($initdb.FullName -join ', ')" }
          $foreign = @(Get-ChildItem $root -Recurse -Directory | Where-Object { $_.FullName -match '@embedded-postgres[\\/](linux|darwin)-' })
          if ($foreign.Count) { Stop-ShapeCheck "Foreign PostgreSQL payload found: $($foreign.FullName -join ', ')" }
          foreach ($required in @(
            "resources/desktop-runtime/bin/server.cjs",
            "resources/desktop-runtime/.next/BUILD_ID",
            "resources/desktop-runtime/node_modules/next/server.js"
          )) {
            if (-not (Test-Path "$root/$required")) { Stop-ShapeCheck "Positive desktop runtime file is missing: $required" }
          }
          if (Test-Path "$root/resources/desktop-runtime/node_modules/typescript") { Stop-ShapeCheck "TypeScript leaked into runtime" }
          if (Test-Path "$root/resources/desktop-runtime/.next/cache") { Stop-ShapeCheck ".next/cache leaked into runtime" }
          Write-Host "PostgreSQL payload: $($postgres[0].FullName)"

      - name: Start disposable PostgreSQL 16 for packaged-tools acceptance
        env:
          PGDATA: ${{ runner.temp }}\package-tools-pgdata
        run: |
          npm run db:dev:start
          npm run db:migrate

      - name: Execute tools from the actual packaged runtime
        env:
          PG_TOOLS_DIR: ${{ github.workspace }}\electron\dist\win-unpacked\resources\postgresql-tools
        run: |
          node scripts/accept-packaged-pg-tools.mjs
          npx tsx scripts/accept-packaged-restore.ts

      - name: Stop packaged-tools acceptance PostgreSQL
        if: always()
        continue-on-error: true
        env:
          PGDATA: ${{ runner.temp }}\package-tools-pgdata
        run: npm run db:dev:stop

      - name: Install and run actual packaged desktop twice as a standard user
        run: |
          $ErrorActionPreference = "Stop"
          $user = "SuiteSmoke"
          $plainPassword = "Suite-Smoke-2026!xQ7"
          $securePassword = ConvertTo-SecureString $plainPassword -AsPlainText -Force
          $smokeRoot = "C:\business-suite-smoke-$env:GITHUB_RUN_ID"
          $installDir = "$smokeRoot\installed"
          $outputPath = "$smokeRoot\smoke-output.txt"
          $exitPath = "$smokeRoot\smoke-exit.txt"
          $commandPath = "$smokeRoot\run-smoke.cmd"
          $repo = (Resolve-Path ".").Path
          $installer = (Get-ChildItem "electron/dist" -File -Filter *.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          $node = (Get-Command node).Source
          $smokeScript = (Resolve-Path "electron/scripts/smoke-packaged.js").Path

          if (-not $installer) { throw "NSIS installer missing before standard-user smoke" }
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $user
          }
          New-LocalUser -Name $user -Password $securePassword -PasswordNeverExpires -UserMayNotChangePassword | Out-Null
          Add-LocalGroupMember -Group "Users" -Member $user -ErrorAction SilentlyContinue

          try {
            # GitHub's Windows runner is elevated and PostgreSQL correctly
            # refuses to run under an administrator token. Exercise the same
            # ordinary-user path as a real Windows 11 installation instead.
            icacls $smokeRoot /grant "${user}:(OI)(CI)F" /T /Q | Out-Null
            icacls $repo /grant "${user}:(RX)" /Q | Out-Null
            icacls "$repo\electron" /grant "${user}:(RX)" /Q | Out-Null
            icacls "$repo\electron\scripts" /grant "${user}:(OI)(CI)RX" /T /Q | Out-Null
            icacls "$repo\electron\dist" /grant "${user}:(OI)(CI)RX" /T /Q | Out-Null

            @"
          @echo off
          setlocal
          set TEMP=$smokeRoot
          set TMP=$smokeRoot
          set GITHUB_ACTIONS=true
          "$installer" /S /D=$installDir
          if errorlevel 1 (
            echo Installer failed with exit code %ERRORLEVEL% > "$outputPath"
            echo %ERRORLEVEL% > "$exitPath"
            exit /b %ERRORLEVEL%
          )
          if not exist "$installDir\Business Suite.exe" (
            echo Installed executable is missing > "$outputPath"
            echo 98 > "$exitPath"
            exit /b 98
          )
          set DESKTOP_EXECUTABLE=$installDir\Business Suite.exe
          "$node" "$smokeScript" > "$outputPath" 2>&1
          set RC=%ERRORLEVEL%
          echo %RC% > "$exitPath"
          exit /b %RC%
          "@ | Set-Content -LiteralPath $commandPath -Encoding ascii

            Start-Service seclogon -ErrorAction SilentlyContinue
            $credential = [pscredential]::new("$env:COMPUTERNAME\$user", $securePassword)
            $process = Start-Process -FilePath $env:ComSpec -ArgumentList "/d /c `"$commandPath`"" `
              -WorkingDirectory $repo -Credential $credential -LoadUser -Wait -PassThru
            if (Test-Path $outputPath) { Get-Content $outputPath }
            $smokeExit = if (Test-Path $exitPath) { [int](Get-Content $exitPath | Select-Object -First 1) } else { $process.ExitCode }
            if ($smokeExit -ne 0) { throw "Standard-user installed smoke exited $smokeExit" }
          } finally {
            Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
          }

      - name: Final size report and budgets
        id: sizes
        run: |
          $ErrorActionPreference = "Stop"
          function Add-GitHubOutput([string]$line) {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$line`n", (New-Object System.Text.UTF8Encoding($false)))
          }
          node scripts/report-desktop-size.mjs --output=desktop-size-report.md
          $exe = Get-ChildItem electron/dist -File -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer missing" }
          $unpacked = (Get-ChildItem electron/dist/win-unpacked -Recurse -File | Measure-Object Length -Sum).Sum
          $tools = (Get-ChildItem electron/dist/win-unpacked/resources/postgresql-tools -Recurse -File | Measure-Object Length -Sum).Sum
          $installerMiB = [math]::Round($exe.Length / 1MB, 1)
          $installedMiB = [math]::Round($unpacked / 1MB, 1)
          $toolsMiB = [math]::Round($tools / 1MB, 1)
          Add-GitHubOutput "installer=$installerMiB"
          Add-GitHubOutput "installed=$installedMiB"
          Add-GitHubOutput "tools=$toolsMiB"
          Add-GitHubOutput "name=$($exe.Name)"
          Write-Host "::notice title=Desktop package sizes::Installer $installerMiB MiB; unpacked installed payload $installedMiB MiB; PostgreSQL tools $toolsMiB MiB"
          # The installer budget is the release gate and is deliberately tight: 157.5 MiB against
          # 175 MiB leaves nothing to hide. The unpacked budget is a runaway detector — it exists to
          # catch a payload that accidentally ships node_modules, a build cache or source maps, not
          # to freeze the app's growth. It sat at 599.8 MiB (0.2 MiB of headroom) before the AEC
          # document-control wave added eight traced API routes and a project tab, which took it to
          # 600.6 MiB; the headroom is therefore 20 MiB rather than the 0.2 MiB the previous
          # threshold implied. The dominant term is .next/server at 103 MiB of *unminified* server
          # chunks — minifying the compile pass is the real win available here, and is tracked
          # separately rather than smuggled into a feature branch.
          if ($exe.Length -gt 175MB) { throw "Installer $installerMiB MiB exceeds the 175 MiB release baseline" }
          if ($unpacked -gt 620MB) { throw "Installed payload $installedMiB MiB exceeds 620 MiB budget" }

      - name: Write Windows Server package evidence
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $runtime = Get-Content packaged-electron-runtime.json -Raw | ConvertFrom-Json
          [ordered]@{
            schemaVersion = 1
            checkId = "windows-server-package"
            status = "PASS"
            commit = $env:GITHUB_SHA
            executedAt = [DateTime]::UtcNow.ToString("o")
            evidenceUrl = $env:RUN_URL
            platform = "$($os.Caption) build $($os.BuildNumber) (Windows Server, not retail Windows 11)"
            signingStatus = "UNSIGNED DEVELOPMENT"
            desktopRuntime = @{ electron=$runtime.electron; node=$runtime.node; chromium=$runtime.chromium }
            checks = @("supported-electron-node-runtime", "pinned-source-postgresql-tools", "packaged-custom-dump-restore", "verified-restore-swap-and-rollback", "standard-user-install", "postgresql-utf8-and-migrations", "restricted-role-boot", "bootstrap-and-auth", "clean-stop", "second-launch-persistence", "size-budgets")
          } | ConvertTo-Json -Depth 6 | Set-Content windows-server-package-evidence.json -Encoding UTF8

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: business-suite-desktop-installer-${{ steps.version.outputs.version }}
          path: electron/dist/*.exe
          if-no-files-found: error

      - name: Upload desktop size reports
        uses: actions/upload-artifact@v7
        with:
          name: business-suite-desktop-size-report
          path: |
            desktop-size-before-package.md
            desktop-size-report.md
            windows-signature-verification.json
            packaged-electron-runtime.json
            packaged-pg-tools-acceptance.json
            packaged-restore-acceptance.json
            controlled-input/source-build.json
            controlled-input/provenance.json
            windows-server-package-evidence.json
            electron/dist/windows-signing-status.json
          if-no-files-found: error

      - name: Job summary
        env:
          NAME: ${{ steps.sizes.outputs.name }}
          INSTALLER: ${{ steps.sizes.outputs.installer }}
          INSTALLED: ${{ steps.sizes.outputs.installed }}
          PG_TOOLS: ${{ steps.sizes.outputs.tools }}
        run: |
          $summary = @"
          ## Business Suite Windows package

          - Installer: **$env:NAME** - **$env:INSTALLER MiB**
          - Unpacked installed payload: **$env:INSTALLED MiB**
          - PostgreSQL backup tools: **$env:PG_TOOLS MiB**, built from pinned PostgreSQL $env:PG_SOURCE_VERSION and zlib $env:ZLIB_SOURCE_VERSION sources with gzip compression
          - Runtime: Next standalone trace + bundled custom server; no root node_modules
          - Acceptance: packaged pg_dump/pg_restore passed custom-format, corruption, encrypted staging, emergency-backup, swap and rollback checks; the packaged executable initialized PostgreSQL UTF-8, migrated, passed RLS boot, bootstrapped through the real API, authenticated, stopped, restarted and retained data
          "@
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$summary`n", (New-Object System.Text.UTF8Encoding($false)))

  # Record the version that was actually built, only once the whole packaged
  # end-to-end passed: a failed build never burns a number. A fresh checkout,
  # because the build job wrote CI provenance (buildCommit/buildId/channel)
  # into electron/package.json that must never be committed. Pushed with
  # GITHUB_TOKEN, which by design triggers no further workflow runs, so the
  # bump commit cannot loop back into this workflow.
  release-version:
    name: commit and tag the desktop version
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Commit the bump and tag desktop-vX.Y.Z
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = "Continue"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Updates package.json and package-lock.json together, no git tag.
          npm version $env:VERSION --no-git-tag-version --allow-same-version --prefix electron
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git add electron/package.json electron/package-lock.json
          git commit -m "Desktop v$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git tag "desktop-v$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The build takes an hour; main may have moved. Replay the one-file
          # bump on top rather than failing the release on a race.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME" "refs/tags/desktop-v$env:VERSION"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            git pull --rebase origin $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::Could not rebase the version bump onto $env:GITHUB_REF_NAME"; exit 1 }
            git tag -f "desktop-v$env:VERSION"
          }
          Write-Host "::error::Could not push desktop-v$env:VERSION"
          exit 1
