# Builds and publishes the production GHCR image, and deploys it.
#
# Triggers: automatically on every push to `main` (publishes `sha-<short>` +
# `latest` and triggers a Coolify redeploy of production), on every pushed
# `v*` tag (publishes that immutable release tag without restarting
# production), and still `workflow_dispatch` for a manual re-run of either of
# those (e.g. re-publish the current `main` after a Coolify hiccup).
#
# Because this now runs unattended on every merge to `main`, the `gate-*` jobs
# below are the only thing standing between a bad merge and a live production
# redeploy — do not weaken it to make this trigger "less noisy".
#
# Tag shape is load-bearing: main publishes `sha-<short>` plus `latest`,
# matching imageRefFor() in src/lib/app-update-status.ts; a v* ref additionally
# publishes its release name for POS_IMAGE_TAG pins. GIT_SHA is passed as a build
# arg because the Dockerfile bakes it into APP_IMAGE_SHA, which is how a running
# container knows which build it is.
#
# The pre-publish gates intentionally test the exact commit being published, so
# a manual run from any ref is gated the same way.
#
# Runs on GitHub-hosted **Ubuntu** runners (`ubuntu-latest`): the image is a
# Linux image (`FROM node:24-alpine`), and hosted Ubuntu runners ship Docker
# with the Linux backend plus buildx, which docker/build-push-action needs.
# Every `run:` block is PowerShell Core (`pwsh`), preinstalled on the hosted
# runners.
name: publish

# Automatic on push to main (publish + redeploy production) and on pushed v*
# tags (publish the release tag only). `workflow_dispatch` is kept for a
# manual re-run of either case.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Never cancel: a half-published image is worse than a slow queue, and two runs
# in a row must each produce their own tag.
concurrency:
  # Branch and release-tag dispatches write to the same package. Keep one
  # global queue so two refs cannot race a tag update or a production restart.
  group: publish-production
  cancel-in-progress: false

defaults:
  run:
    # PowerShell Core — preinstalled on GitHub-hosted Ubuntu runners.
    shell: pwsh

env:
  NODE_OPTIONS: --max-old-space-size=3072
  # Session signing is not what's under test here, but the auth/webauthn
  # suites need a real (non-placeholder) secret and `next build` does not read
  # .env. Throwaway, CI-only, never used to sign anything real.
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef

jobs:
  # The pre-publish gates are the same four checks as before (lint, type check,
  # unit tests, production build), run as parallel jobs instead of one serial
  # job. `docker-publish` needs all four, so nothing is published unless every
  # gate passed on this exact commit — the gate is not weakened, only no longer
  # a queue.
  gate-lint:
    name: pre-publish gate - lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  gate-typecheck:
    name: pre-publish gate - type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  gate-unit-tests:
    name: pre-publish gate - unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  gate-build:
    name: pre-publish gate - production build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json', 'package.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  docker-publish:
    name: publish image (GHCR)
    runs-on: ubuntu-latest
    needs: [gate-lint, gate-typecheck, gate-unit-tests, gate-build]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The deploy verification at the end of this job is a Node script.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The Dockerfile is `FROM node:24-alpine` — a Linux image. Hosted Ubuntu
      # runners always have Docker running with the Linux backend, which is why
      # this job is not on `windows-latest` with the others.
      - name: Compute short sha
        id: sha
        run: |
          $short = "$env:GITHUB_SHA".Substring(0, 7)
          # PowerShell Core writes UTF-8 without a BOM, so plain appends are
          # safe for $GITHUB_OUTPUT here.
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
            NODE_OPTIONS=${{ env.NODE_OPTIONS }}
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository }}:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Trigger Coolify redeploy
        if: github.ref_type == 'branch'
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          # `latest=true` is load-bearing for a Docker-image service: a plain
          # restart would recreate the old local image and report success.
          # Do not automatically retry this POST — Coolify may have queued the
          # restart before a response is lost, and a retry would cause the
          # duplicate restarts visible in the production logs.
          $ErrorActionPreference = "Stop"
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://manage.eshobe.com/api/v1/services/jrfpvt0rctfkmzpw1ao5c1cb/restart?latest=true" `
            -Headers @{ Authorization = "Bearer $env:COOLIFY_API_TOKEN" } `
            -TimeoutSec 30 | Out-Null

      - name: Report an unverified production rollout
        if: github.ref_type == 'branch' && vars.PRODUCTION_HEALTH_URL == ''
        run: |
          Write-Host "::warning title=Production rollout unverified::Coolify accepted a redeploy request, but PRODUCTION_HEALTH_URL is unset so this run cannot prove the live image or canonical routes changed. Set it to https://<live-host>/api/health."

      - name: Verify the published image and canonical routes are live
        # Production verification is intentionally opt-in until the service's
        # public hostname has been stored as the non-secret repository variable
        # PRODUCTION_HEALTH_URL. A restart acknowledgement only says Coolify
        # queued work; it is not proof that the new image replaced the old one.
        #
        # Set the value to https://<live-host>/api/health. The verifier waits
        # for APP_IMAGE_SHA, then checks every route involved in the top-level
        # apps/settings cutover takes the canonical signed-out login redirect
        # (rather than 404ing or falling back to /dashboard/*).
        if: github.ref_type == 'branch' && vars.PRODUCTION_HEALTH_URL != ''
        timeout-minutes: 12
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.short }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          DEPLOY_VERIFY_ATTEMPTS: "60"
          DEPLOY_VERIFY_DELAY_MS: "10000"
        run: node scripts/verify-production-deploy.mjs
