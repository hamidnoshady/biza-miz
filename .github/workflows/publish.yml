# Builds the production GHCR image on every merge to `main`, and promotes a
# staging-tested image to production only on an explicit manual dispatch.
#
# Flow (changed from "every merge redeploys production"):
#
#   push to `main`      -> gate-* (lint, type check, unit tests, production
#                          build) -> build and push ONLY `sha-<short>`.
#                          No `latest`, no Coolify restart. Production does not
#                          move. Test `sha-<short>` in staging.
#   workflow_dispatch   -> input `sha` = the commit whose `sha-<short>` image
#   (promote)              was tested in staging. Verifies that image already
#                          exists in GHCR (never rebuilds), re-tags that exact
#                          manifest as `latest` with `docker buildx imagetools
#                          create` (the attestation manifests — provenance and
#                          SBOM — travel with the index), then triggers the
#                          Coolify restart (`latest=true`) and verifies the
#                          rollout exactly as before.
#   push of a `v*` tag  -> gate-* -> build and push `sha-<short>` plus the
#                          immutable release tag, for POS_IMAGE_TAG pins. No
#                          production restart, as before.
#
# To re-publish a `sha-<short>` image (e.g. after a GHCR hiccup) re-run the
# push-triggered run from the Actions UI; a dispatch never builds.
#
# The `gate-*` jobs are the only thing standing between a bad merge and a
# published image, and that image is one dispatch away from production — do not
# weaken them to make the trigger "less noisy".
#
# Tag shape is load-bearing: `sha-<short>` is the immutable per-commit tag
# (short = first 7 hex of the commit) and is what staging runs and what
# `promote` looks up; `latest` is only ever a re-tag of one of those. GIT_SHA is
# passed as a build arg because the Dockerfile bakes it into APP_IMAGE_SHA,
# which is how a running container (and scripts/verify-production-deploy.mjs)
# knows which build it is.
#
# Runs on GitHub-hosted **Ubuntu** runners (`ubuntu-latest`): the image is a
# Linux image (`FROM node:24-alpine`), and hosted Ubuntu runners ship Docker
# with the Linux backend plus buildx, which docker/build-push-action needs.
# Every `run:` block is PowerShell Core (`pwsh`), preinstalled on the hosted
# runners.
name: publish

# Automatic on push to main (build + push `sha-<short>` only) and on pushed v*
# tags (also the release tag). `workflow_dispatch` is the production promotion:
# it re-tags an existing `sha-<short>` image as `latest` and restarts Coolify.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit (short or full SHA) whose ghcr.io image `sha-<short>` was
          tested in staging. That exact image is re-tagged `latest` and
          production is redeployed. Nothing is rebuilt.
        required: true
        type: string

# Never cancel: a half-published image is worse than a slow queue, and two runs
# in a row must each produce their own tag.
concurrency:
  # Branch pushes, release-tag pushes and promotions write to the same package.
  # Keep one global queue so two runs cannot race a tag update or a production
  # restart (e.g. a promotion landing while a main build is mid-push).
  group: publish-production
  cancel-in-progress: false

defaults:
  run:
    # PowerShell Core — preinstalled on GitHub-hosted Ubuntu runners.
    shell: pwsh

env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Session signing is not what's under test here, but the auth/webauthn
  # suites need a real (non-placeholder) secret and `next build` does not read
  # .env. Throwaway, CI-only, never used to sign anything real.
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef

jobs:
  # The pre-publish gates are the same four checks as before (lint, type check,
  # unit tests, production build), run as parallel jobs. `docker-publish` needs
  # all four, so no image is built unless every gate passed on this exact
  # commit. They run for push events only: a promotion dispatch builds nothing
  # and re-tags an image these gates already passed when it was built.
  gate-lint:
    name: pre-publish gate - lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  gate-typecheck:
    name: pre-publish gate - type check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # From-scratch `tsc --noEmit` over this program (5.6k files, incremental
    # state never survives CI checkout) now needs ~3.2 GB old-space —
    # measured 3,249,018K heapUsed under a 3200 MB cap (--extendedDiagnostics),
    # i.e. ~99% of it. The workflow-wide 3072 cap therefore kills the checker
    # with a bare V8 heap OOM (exit 1, zero diagnostics) since main's
    # notifications graph landed (#1036; the gate on main itself went red the
    # same way). This job alone runs the full-program check, so it alone
    # gets the headroom; every other job keeps 3072.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - env:
          # Same heap as test.yml's type check (#1054): a clean full-program tsc OOMs at the workflow-wide 3072 MB.
          NODE_OPTIONS: --max-old-space-size=6144
        run: node node_modules/typescript/lib/tsc.js --noEmit

  gate-unit-tests:
    name: pre-publish gate - unit tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  gate-build:
    name: pre-publish gate - production build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json', 'package.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  docker-publish:
    name: build and push sha image (GHCR)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [gate-lint, gate-typecheck, gate-unit-tests, gate-build]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile is `FROM node:24-alpine` — a Linux image. Hosted Ubuntu
      # runners always have Docker running with the Linux backend, which is why
      # this job is not on `windows-latest` with the others.
      - name: Compute short sha and the tags to push
        id: sha
        run: |
          $short = "$env:GITHUB_SHA".Substring(0, 7)
          $image = "ghcr.io/$env:GITHUB_REPOSITORY"
          # main publishes only the immutable per-commit tag. `latest` is never
          # written here — only the `promote` job below writes it, on dispatch.
          $tags = "${image}:sha-$short"
          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            # A v* release additionally gets its immutable release name, for
            # POS_IMAGE_TAG pins. Still no `latest`.
            $tags += ",${image}:$env:GITHUB_REF_NAME"
          }
          # PowerShell Core writes UTF-8 without a BOM, so plain appends are
          # safe for $GITHUB_OUTPUT here.
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tags=$tags" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Publishing: $tags"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
            NODE_OPTIONS=${{ env.NODE_OPTIONS }}
          # #1107's rule: a push publishes only immutable per-commit tags
          # (`sha-<short>`, plus the release name for a v* tag) — `latest` is
          # written only by the `promote` job on dispatch. The tag list is
          # computed by the step above, so it is referenced, not rebuilt.
          tags: ${{ steps.sha.outputs.tags }}
          # Keep the release cache separate from verify-shippables; both workflows
          # may build on main at once. Cache export is best-effort and must not
          # prevent an otherwise successful image publication/deployment.
          cache-from: type=gha,scope=production-publish
          cache-to: type=gha,scope=production-publish,mode=max,ignore-error=true
          provenance: true
          sbom: true

      - name: Next step
        run: |
          Write-Host "::notice title=Image published, production unchanged::ghcr.io/${env:GITHUB_REPOSITORY}:sha-${{ steps.sha.outputs.short }} is ready for staging. To promote it, run this workflow manually (workflow_dispatch) with sha=${{ steps.sha.outputs.short }}."

  promote:
    name: promote sha image to latest and redeploy production
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The deploy verification at the end of this job is a Node script.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve the requested sha
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $raw = "$env:INPUT_SHA".Trim().ToLowerInvariant()
          # Accept `sha-<short>` too, since that is what people copy from GHCR.
          if ($raw.StartsWith("sha-")) { $raw = $raw.Substring(4) }
          if ($raw -notmatch '^[0-9a-f]{7,40}$') {
            Write-Host "::error title=Invalid sha input::'$env:INPUT_SHA' is not a 7-40 hex Git SHA (optionally prefixed sha-)."
            exit 1
          }
          $short = $raw.Substring(0, 7)
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Promoting ghcr.io/${env:GITHUB_REPOSITORY}:sha-$short to latest"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the sha image already exists (never rebuild here)
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}
        run: |
          # The whole point of this job is to ship the bytes that were tested in
          # staging. If the tag is missing, the commit was never built by a
          # main/v* push — stop, do not build a fresh (untested) image.
          docker buildx imagetools inspect $env:IMAGE
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Image not found::$env:IMAGE does not exist in GHCR. Only commits pushed to main (or a v* tag) have a sha image; merge first, let the push run publish it, test it in staging, then promote."
            exit 1
          }

      - name: Re-tag the exact image as latest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHORT: ${{ steps.sha.outputs.short }}
        run: |
          $ErrorActionPreference = "Stop"
          # `imagetools create` copies the existing manifest index under a new
          # tag — same digest, same layers, and the attestation manifests
          # (provenance + SBOM) that build-push-action attached stay in the
          # index. Nothing is rebuilt.
          docker buildx imagetools create -t "${env:IMAGE}:latest" "${env:IMAGE}:sha-${env:SHORT}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker buildx imagetools inspect "${env:IMAGE}:latest"

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          # `latest=true` is load-bearing for a Docker-image service: a plain
          # restart would recreate the old local image and report success.
          # Do not automatically retry this POST — Coolify may have queued the
          # restart before a response is lost, and a retry would cause the
          # duplicate restarts visible in the production logs.
          $ErrorActionPreference = "Stop"
          $coolifyUri = "https://manage.eshobe.com/api/v1/services/jrfpvt0rctfkmzpw1ao5c1cb/restart?latest=true"
          try {
            Invoke-RestMethod `
              -Method Post `
              -Uri $coolifyUri `
              -Headers @{ Authorization = "Bearer $env:COOLIFY_API_TOKEN" } `
              -TimeoutSec 30 | Out-Null
          } catch {
            # This step failed for days reporting only "exit code 1", so the
            # cause — a bad token, a wrong service id, a 5xx — was invisible
            # from the run summary. Print what Coolify actually answered, then
            # rethrow: the job must still fail. Still no retry — see above.
            $status = "no response"
            if ($_.Exception.Response) {
              $status = [int]$_.Exception.Response.StatusCode
            }
            Write-Host "::error title=Coolify redeploy failed::HTTP $status from $coolifyUri"
            if ($_.ErrorDetails.Message) { Write-Host $_.ErrorDetails.Message }
            Write-Host $_.Exception.Message
            throw
          }

      - name: Report an unverified production rollout
        # `success() || failure()` is load-bearing: a bare expression here gets
        # an implicit success() prefix, so this warning was skipped in exactly
        # the case it exists for — when the redeploy above failed and production
        # is therefore *also* unverified.
        if: vars.PRODUCTION_HEALTH_URL == '' && (success() || failure())
        run: |
          Write-Host "::warning title=Production rollout unverified::Coolify accepted a redeploy request, but PRODUCTION_HEALTH_URL is unset so this run cannot prove the live image or canonical routes changed. Set it to https://<live-host>/api/health."

      - name: Verify the published image and canonical routes are live
        # Production verification is intentionally opt-in until the service's
        # public hostname has been stored as the non-secret repository variable
        # PRODUCTION_HEALTH_URL. A restart acknowledgement only says Coolify
        # queued work; it is not proof that the new image replaced the old one.
        #
        # Set the value to https://<live-host>/api/health. The verifier waits
        # for APP_IMAGE_SHA, then checks every route involved in the top-level
        # apps/settings cutover takes the canonical signed-out login redirect
        # (rather than 404ing or falling back to /dashboard/*).
        if: vars.PRODUCTION_HEALTH_URL != ''
        timeout-minutes: 12
        env:
          EXPECTED_SHA: ${{ steps.sha.outputs.short }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          DEPLOY_VERIFY_ATTEMPTS: "60"
          DEPLOY_VERIFY_DELAY_MS: "10000"
        run: node scripts/verify-production-deploy.mjs
