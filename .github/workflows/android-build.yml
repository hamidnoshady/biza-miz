name: android-build

# Builds, lints and unit-tests the Android Trusted Web Activity shell, and runs the web side of
# the native bridge (issue #884). It runs only when a file that can change either of them is
# touched. The signed staging and production paths are separate, manual workflows.

on:
  pull_request:
    paths:
      - 'android/**'
      - 'config/android-environments.json'
      - 'config/native-bridge-contract.json'
      - 'public/.well-known/assetlinks.json'
      - 'src/lib/native/**'
      - 'src/components/native/**'
      - '.github/workflows/android-build.yml'
  # No `paths:` on push on purpose. A push to `main` always builds, so there is an APK for the
  # current `main` commit; before, a `main` commit that touched no Android file ran nothing and
  # the newest APK was whichever earlier commit last changed `android/**`. The `changes` job below
  # applies the same path list to `arena/**` pushes, so those still skip when nothing Android changed.
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:
    inputs:
      web_origin:
        description: >-
          Optional. A bare https origin (lowercase host, no path or port) for the development debug
          APK to open instead of the placeholder https://app.invalid, so the APK can be installed
          and used against a real host. Empty = the committed placeholder.
        type: string
        required: false
        default: ''

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the Android jobs run. Pull requests are already filtered by `paths:` above, a
  # push to `main` and a manual run always build, and an `arena/**` push builds only when a file in
  # the same path list changed in the pushed range (or when that range cannot be worked out).
  changes:
    name: android files changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        with:
          fetch-depth: 0
          filter: blob:none
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          run=true
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; then
            if files=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null); then
              if printf '%s\n' "$files" | grep -Eq '^(android/|config/android-environments\.json$|config/native-bridge-contract\.json$|public/\.well-known/assetlinks\.json$|src/lib/native/|src/components/native/|\.github/workflows/android-build\.yml$)'; then
                run=true
              else
                run=false
              fi
            fi
          fi
          echo "android=$run" >> "$GITHUB_OUTPUT"
          echo "Android jobs will run: $run"

  web-bridge-tests:
    name: web native bridge tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run src/lib/native src/components/native

  android-debug:
    name: android development debug
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 36 and build-tools 36.0.0
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # A manual run may point the development APK at a real host. The pattern is the same one
      # android/app/build.gradle.kts enforces, checked here so a typo fails in seconds.
      - name: Choose the web origin for the development APK
        env:
          WEB_ORIGIN: ${{ inputs.web_origin }}
        run: |
          set -euo pipefail
          if [ -n "$WEB_ORIGIN" ]; then
            if [[ ! "$WEB_ORIGIN" =~ ^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$ ]]; then
              echo "web_origin must be a bare https origin such as https://app.example.com" >&2
              exit 1
            fi
            echo "BIZA_ANDROID_WEB_ORIGIN_DEVELOPMENT=$WEB_ORIGIN" >> "$GITHUB_ENV"
          fi

      # The NON-PRODUCTION label is part of the artifact name on purpose: this build points at
      # https://app.invalid and is signed with the throwaway debug key.
      # The full Gradle output is kept in android/gradle-run.log. It is uploaded on failure, and the
      # step after this one repeats the error lines as annotations, which the API can read.
      - name: Lint, unit tests and assemble the development debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintDevelopmentDebug :app:testDevelopmentDebugUnitTest :app:assembleDevelopmentDebug 2>&1 | tee gradle-run.log

      - name: Repeat the Gradle error lines as annotations when the build fails
        if: failure()
        working-directory: android
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("gradle-run.log")
          if path.exists():
              lines = path.read_text(errors="replace").splitlines()
          else:
              lines = ["Gradle wrote no log: the failure happened before the build started."]
          pattern = re.compile(r"^e: |^w: .*error|What went wrong|^> |\s+Execution failed|Could not |Caused by|BUILD FAILED|error:|Error:|Exception|FAILURE|FAILED")
          keep = [line for line in lines if pattern.search(line)]
          tail = lines[-80:]
          combined = keep[:80] + ["--- tail ---"] + tail
          body = "\n".join(combined)[:6000]
          encoded = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle failure::" + encoded)
          PY

      # The release guard is only worth having if it fires. This asks for a staging release with no
      # origin and no signing, and fails the job unless Gradle refuses it with the guard's message.
      - name: Check that a staging release is refused without an origin and signing
        working-directory: android
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleStagingRelease > release-guard.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "A staging release built without a web origin or signing." >&2
            exit 1
          fi
          if ! grep -q "Cannot build staging release" release-guard.log; then
            echo "The release build failed, but not because of the release guard:" >&2
            tail -n 40 release-guard.log >&2
            exit 1
          fi
          echo "The release guard refused the staging release, as intended."

      - name: Say where the APK is
        run: |
          {
            echo '### Android development debug APK (NON-PRODUCTION)'
            echo
            echo 'Download the artifact `biza-miz-android-development-debug-NON-PRODUCTION` below, unzip it and install `app-development-debug.apk`.'
            if [ -n "${BIZA_ANDROID_WEB_ORIGIN_DEVELOPMENT:-}" ]; then
              echo "It opens \`${BIZA_ANDROID_WEB_ORIGIN_DEVELOPMENT}\`."
            else
              echo 'It opens `https://app.invalid`, a placeholder that does not resolve, so Chrome shows an error page. Run this workflow by hand with `web_origin` set to build one against a real host.'
            fi
            echo 'It is debug-signed and uses the development application ID. The signed staging and production APKs come from `android-signed-candidate` and `android-production-release`, which are manual.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the development debug APK (NON-PRODUCTION)
        uses: actions/upload-artifact@v7
        with:
          name: biza-miz-android-development-debug-NON-PRODUCTION
          path: android/app/build/outputs/apk/development/debug/app-development-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports when the job fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-reports
          path: |
            android/gradle-run.log
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
