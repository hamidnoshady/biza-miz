name: android-signed-candidate

# Manual, main only. Builds a signed STAGING candidate (APK and AAB) of the Android shell, for
# a device check against the staging web origin. Nothing is uploaded to a store from here. The
# android-staging environment holds the signing secrets and can be given required reviewers.

on:
  workflow_dispatch:

concurrency:
  group: android-signed-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: signed staging candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-staging
    env:
      BIZA_ANDROID_WEB_ORIGIN_STAGING: ${{ vars.ANDROID_WEB_ORIGIN_STAGING }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 36 and build-tools 36.0.0
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the upload keystore into the runner's temporary directory
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "NOT CONFIGURED: ANDROID_KEYSTORE_BASE64 is not set for the android-staging environment." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/biza-miz-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "BIZA_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build the staging release APK and AAB
        working-directory: android
        env:
          BIZA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BIZA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BIZA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleStagingRelease :app:bundleStagingRelease

      - name: Verify the APK signature
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk=$(ls android/app/build/outputs/apk/staging/release/*.apk | head -n 1)
          "$apksigner" verify --print-certs "$apk"

      - name: Record checksums
        run: |
          set -euo pipefail
          {
            echo '### Android staging candidate'
            echo '```'
            sha256sum android/app/build/outputs/apk/staging/release/*.apk android/app/build/outputs/bundle/stagingRelease/*.aab
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the staging candidate
        uses: actions/upload-artifact@v7
        with:
          name: biza-miz-android-staging-candidate-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/staging/release/*.apk
            android/app/build/outputs/bundle/stagingRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove the decoded keystore
        if: always()
        run: |
          if [ -n "${BIZA_ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$BIZA_ANDROID_KEYSTORE_PATH"
          fi
