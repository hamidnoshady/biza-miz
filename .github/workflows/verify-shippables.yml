# Checks the parts of the platform that ship to a customer's machine but that
# `test.yml` never touches: the production container, Electron desktop shell,
# WordPress plugin, and the PowerShell that runs on a cafe PC.
#
# Why this is separate from `test.yml`: none of it is `src/`. `test.yml` runs
# tsc, vitest and `next build` over the web app, so a syntax error in
# `electron/main.js`, a BOM in a plugin PHP file, or a version bumped in two of
# its three required places is invisible there — and the *first* time anyone
# finds out is when the installer fails to launch on a cafe PC or WordPress
# refuses the zip. These checks are seconds long and catch exactly that class
# of breakage.
#
# Triggers: `workflow_dispatch` (run it by hand before either release build),
# plus `pull_request` and `push` to `main`, scoped with `paths:` to only the
# files this workflow actually checks (`Dockerfile`, `electron/`, desktop build
# scripts, release workflow PowerShell, `public/windows/`, `wordpress-plugin/`).
# It remains active whenever production application code or one of those shipped
# surfaces changes.
#
# Job scoping: the workflow-level `paths:` is the union that wakes the workflow
# up; the `changes` job then decides per shippable which jobs actually run, so
# a WordPress-plugin-only change does not rebuild the container/desktop shell
# and a desktop-only change does not re-lint the plugin. `workflow_dispatch`
# always runs everything (that is the pre-release "check it all" button).
# A skipped job reports `skipped`, which required-check rollups treat as
# passing, so scoping never blocks an unrelated PR.
#
# It deliberately does not publish or retain release artifacts. It performs a
# no-push production-container build; `.exe` packaging remains in
# `build-desktop-installer.yml`, and plugin zip publishing remains separate.
name: verify-shippables

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit or branch the desktop shell job measures. Empty = the commit this run is on. Lets a base commit be measured on the same runner image as a pull request.'
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - 'electron/**'
      # Shipped app source wakes the workflow; test files never ship, so
      # test-only changes don't (except the three posture tests the desktop
      # job executes). The `changes` job then scopes jobs per shippable.
      - 'src/**'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - 'src/lib/desktop-runtime-posture.test.ts'
      - 'src/lib/desktop-network-interfaces.test.ts'
      - 'src/lib/chromium-executable.test.ts'
      - 'migrations/**'
      - 'scripts/build-desktop-runtime.mjs'
      - 'scripts/verify-packaged-electron-runtime.ps1'
      - 'scripts/verify-windows-signatures.ps1'
      - 'scripts/accept-physical-printer.ps1'
      - 'config/windows-signing-manifest.json'
      - 'config/windows-installer-signing-manifest.json'
      - 'scripts/desktop/**'
      - 'server.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'public/windows/**'
      - 'wordpress-plugin/**'
      - '.github/workflows/*.yml'
  # GitHub suppresses PR-synchronize events created by the Arena GitHub App.
  # Keep shipped-runtime checks active on those branch pushes as well.
  push:
    branches: [main, 'arena/**']
    paths:
      - 'electron/**'
      # Same shipped-source rule as the pull_request trigger above.
      - 'src/**'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - 'src/lib/desktop-runtime-posture.test.ts'
      - 'src/lib/desktop-network-interfaces.test.ts'
      - 'src/lib/chromium-executable.test.ts'
      - 'migrations/**'
      - 'scripts/build-desktop-runtime.mjs'
      - 'scripts/verify-packaged-electron-runtime.ps1'
      - 'scripts/verify-windows-signatures.ps1'
      - 'scripts/accept-physical-printer.ps1'
      - 'config/windows-signing-manifest.json'
      - 'config/windows-installer-signing-manifest.json'
      - 'scripts/desktop/**'
      - 'server.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'public/windows/**'
      - 'wordpress-plugin/**'
      - '.github/workflows/*.yml'

# Keep PR and Arena-push groups distinct. Cancelling the fallback run leaves
# cancelled check contexts attached to the same review commit.
concurrency:
  group: verify-shippables-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Windows PowerShell 5.1 — always present on Windows, unlike `pwsh`.
    shell: powershell

jobs:
  # Decides which shippable actually changed, so only its jobs run. Uses
  # plain `git diff` instead of a third-party action, in keeping with this
  # repo's "only what the runner ships" rule. Fail-open: whenever the base
  # commit cannot be determined (forced push, brand-new branch) or the event
  # is a manual dispatch, every job runs — scoping only ever *skips* work it
  # can prove is unrelated, never the other way around.
  changes:
    name: which shippables changed
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.classify.outputs.container }}
      desktop: ${{ steps.classify.outputs.desktop }}
      plugin: ${{ steps.classify.outputs.plugin }}
      connector: ${{ steps.classify.outputs.connector }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff base (PR base branch or push `before`) must be reachable.
          fetch-depth: 0

      - name: Classify changed files per shippable
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          container=false; desktop=false; plugin=false; connector=false
          run_all=false

          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push)         base="$PUSH_BEFORE" ;;
            *)            run_all=true ;;  # workflow_dispatch: the pre-release "check it all" button
          esac
          if [ "$run_all" = false ]; then
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "diff base unavailable — running every job"
              run_all=true
            fi
          fi

          if [ "$run_all" = true ]; then
            container=true; desktop=true; plugin=true; connector=true
          else
            # `...` (merge-base diff) so a stale PR branch is judged by what
            # the PR itself changes, not by what main gained in the meantime.
            files="$(git diff --name-only "$base"..."$GITHUB_SHA")"
            echo "changed files:"; echo "$files" | sed 's/^/  /'

            while IFS= read -r f; do
              [ -z "$f" ] && continue

              # A change to this workflow re-verifies everything it gates.
              case "$f" in
                .github/workflows/verify-shippables.yml)
                  container=true; desktop=true; plugin=true; connector=true ;;
              esac

              # App source ships inside both the container and the desktop
              # runtime — but test files never ship, so test-only changes do
              # not rebuild either. (In a `case` pattern `*` crosses `/`, so
              # `src/*.test.ts` matches at any depth.) The three posture tests
              # the desktop job itself executes stay desktop triggers.
              is_shipped_app_source=false
              case "$f" in
                src/*.test.ts|src/*.test.tsx) : ;;
                src/*) is_shipped_app_source=true ;;
              esac
              case "$f" in
                src/lib/desktop-runtime-posture.test.ts|src/lib/desktop-network-interfaces.test.ts|src/lib/chromium-executable.test.ts)
                  desktop=true ;;
              esac
              # Shared app plumbing that both shipped runtimes carry.
              case "$f" in
                migrations/*|server.ts|next.config.ts|package.json|package-lock.json)
                  is_shipped_app_source=true ;;
              esac
              if [ "$is_shipped_app_source" = true ]; then
                container=true; desktop=true
              fi

              case "$f" in
                Dockerfile|docker-entrypoint.sh) container=true ;;
              esac

              case "$f" in
                electron/*|scripts/desktop/*|scripts/build-desktop-runtime.mjs|config/windows-signing-manifest.json|config/windows-installer-signing-manifest.json)
                  desktop=true ;;
              esac

              case "$f" in
                wordpress-plugin/*) plugin=true ;;
              esac

              # The connector job parses the cafe-PC PowerShell and the
              # PowerShell embedded in the release workflows.
              case "$f" in
                public/windows/*|scripts/verify-packaged-electron-runtime.ps1|scripts/verify-windows-signatures.ps1|scripts/accept-physical-printer.ps1|.github/workflows/*)
                  connector=true ;;
              esac
            done <<< "$files"
          fi

          {
            echo "container=$container"
            echo "desktop=$desktop"
            echo "plugin=$plugin"
            echo "connector=$connector"
          } >> "$GITHUB_OUTPUT"
          echo "container=$container desktop=$desktop plugin=$plugin connector=$connector"

  container:
    name: production container
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the production image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: business-suite:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            NODE_OPTIONS=--max-old-space-size=3072
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert supported production Node.js and required runtime tools
        run: |
          set -euo pipefail
          version="$(docker run --rm --entrypoint node business-suite:ci --version)"
          case "$version" in
            v24.*) ;;
            *) echo "Production image must carry Node.js 24.x, found $version" >&2; exit 1 ;;
          esac
          docker run --rm --entrypoint sh business-suite:ci -c '
            test -x ./node_modules/.bin/tsx &&
            command -v chromium-browser >/dev/null &&
            command -v pg_dump >/dev/null &&
            command -v pg_restore >/dev/null
          '
          echo "Production image Node.js: $version"

  desktop:
    name: desktop shell
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty = the commit this run is on. A manual run may name another
          # commit (for example a PR's base) to measure it on this runner image.
          ref: ${{ inputs.source_ref || github.sha }}
      # The size tooling comes from the commit running this workflow, not from
      # the measured commit, so a base that predates the tooling can still be
      # measured with it. Sparse, and kept out of the staged runtime.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .size-tooling
          sparse-checkout: |
            scripts/desktop-size-diagnostics.ts
            src/lib/desktop-size-diagnostics.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci

      - name: Stage explicit development PostgreSQL-tools status
        run: npm run desktop:stage-pg-tools

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Desktop production posture tests
        run: npx vitest run src/lib/desktop-runtime-posture.test.ts src/lib/desktop-network-interfaces.test.ts src/lib/chromium-executable.test.ts

      - name: Build production app and staged desktop runtime
        env:
          JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef
        run: |
          npm run build
          npm run desktop:runtime

      - name: Install Electron dependencies for this platform
        working-directory: electron
        run: npm ci --ignore-scripts

      - name: Audit Electron production dependencies
        working-directory: electron
        run: npm audit --omit=dev --audit-level=high

      - name: Electron sources parse
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem electron -Recurse -File -Filter *.js |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($f.FullName) does not parse" }
          }

      - name: New positive runtime constraints hold
        working-directory: electron
        run: npm run verify:runtime

      - name: Staged runtime stays below pre-package budget
        run: |
          $bytes = (Get-ChildItem .desktop-runtime -Recurse -File | Measure-Object Length -Sum).Sum
          $mib = [math]::Round($bytes / 1MB, 1)
          Write-Host "staged desktop runtime: $mib MiB"
          if ($bytes -gt 200MB) { throw "Staged runtime $mib MiB exceeds 200 MiB budget" }

      # Runs after the budget step even when it fails: the notices and the
      # manifest are the numbers a failed budget otherwise never shows.
      - name: Staged runtime size diagnostics
        if: always()
        run: npx tsx .size-tooling/scripts/desktop-size-diagnostics.ts --root=.desktop-runtime --label=staged-runtime --out=desktop-size-diagnostics

      - name: Upload staged runtime size diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-staged-runtime-size
          path: desktop-size-diagnostics
          if-no-files-found: warn

  plugin:
    name: WordPress plugin
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # WordPress reads the version from three places and they must agree:
      # the `Version:` header (what the plugins screen shows), the
      # POS_CONNECTOR_VERSION constant (what the update check compares), and
      # readme.txt's `Stable tag`. build-plugin-zip.yml bumps all three; a
      # hand-edit that misses one ships a plugin that never offers its update.
      - name: Plugin version is consistent across all three places
        run: |
          $ErrorActionPreference = "Stop"
          $root   = "wordpress-plugin/pos-accounting-connector"
          $php    = [IO.File]::ReadAllText((Resolve-Path "$root/pos-accounting-connector.php"))
          $readme = [IO.File]::ReadAllText((Resolve-Path "$root/readme.txt"))

          $header = [regex]::Match($php,    '\*\s*Version:\s*([0-9.]+)').Groups[1].Value
          $const  = [regex]::Match($php,    "define\( 'POS_CONNECTOR_VERSION', '([^']+)' \)").Groups[1].Value
          $stable = [regex]::Match($readme, 'Stable tag:\s*([0-9.]+)').Groups[1].Value

          Write-Host "header=$header const=$const stable=$stable"
          if (-not $header -or -not $const -or -not $stable) {
            Write-Host "::error::could not read all three version fields"; exit 1
          }
          if ($header -ne $const -or $const -ne $stable) {
            Write-Host "::error::plugin version mismatch - header=$header, POS_CONNECTOR_VERSION=$const, Stable tag=$stable. All three must agree."
            exit 1
          }
          if ($readme -notmatch [regex]::Escape("= $const =")) {
            Write-Host "::error::readme.txt has no changelog entry for $const."
            exit 1
          }
          Write-Host "plugin version $const is consistent and documented"

      # A UTF-8 BOM is invisible in an editor and fatal in WordPress: PHP emits
      # those bytes before WordPress sends its headers, so the site dies with
      # "headers already sent". The plugin is full of Persian text, so it is
      # genuinely easy for an editor to add one.
      - name: No BOM in plugin sources
        run: |
          $ErrorActionPreference = "Stop"
          $bad = @()
          # Filter the extension after a LiteralPath traversal. PowerShell's
          # `-Include` has surprising wildcard rules and once matched nothing
          # here; the count assertion below is the backstop for that whole
          # class of mistake.
          $scanned = 0
          foreach ($f in Get-ChildItem -LiteralPath "wordpress-plugin" -Recurse -File | Where-Object { $_.Extension -in @(".php", ".txt") }) {
            $scanned++
            $bytes = [IO.File]::ReadAllBytes($f.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              $bad += $f.FullName
            }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error::UTF-8 BOM found (WordPress will report 'headers already sent'): $($bad -join ', ')"
            exit 1
          }
          if ($scanned -eq 0) {
            Write-Host "::error::the BOM check matched no files at all - the glob is wrong, so this check was proving nothing."
            exit 1
          }
          Write-Host "no BOM in $scanned files"

      # Only runs where PHP exists. Skipped rather than failed, so the job is
      # useful on a machine without PHP installed.
      - name: PHP syntax (skipped when PHP is not installed)
        run: |
          $php = Get-Command php -ErrorAction SilentlyContinue
          if (-not $php) {
            Write-Host "::notice::PHP is not installed on this runner - skipping the syntax check. Install PHP to enable it."
            exit 0
          }
          $failed = $false
          foreach ($f in Get-ChildItem -Path wordpress-plugin -Recurse -File -Filter *.php) {
            php -l $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { Write-Host "::error::PHP syntax errors above"; exit 1 }

      # The zip is assembled the same way build-plugin-zip.yml assembles it, so
      # a packaging problem surfaces here instead of halfway through a release
      # that has already committed and tagged a version bump.
      - name: The release zip would be well-formed
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $pluginDir = Resolve-Path "wordpress-plugin/pos-accounting-connector"
          $zipPath   = Join-Path $env:RUNNER_TEMP "plugin-shape-check.zip"
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }

          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($f in Get-ChildItem -LiteralPath $pluginDir -Recurse -File | Where-Object { $_.Name -ne ".DS_Store" }) {
              $rel = $f.FullName.Substring($pluginDir.Path.Length).TrimStart("\", "/").Replace("\", "/")
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $f.FullName, "pos-accounting-connector/$rel") | Out-Null
            }
          } finally { $zip.Dispose() }

          $check = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = $check.Entries | ForEach-Object { $_.FullName }
            if ($names -notcontains "pos-accounting-connector/pos-accounting-connector.php") {
              Write-Host "::error::the plugin's main file would be missing from the zip"; exit 1
            }
            # WordPress's unzipper treats a backslash as part of the filename,
            # which installs the plugin as one flat file.
            $backslashed = $names | Where-Object { $_.Contains("\") }
            if ($backslashed) { Write-Host "::error::zip entries contain backslashes: $($backslashed -join ', ')"; exit 1 }
            Write-Host "zip shape ok: $($names.Count) entries, all under pos-accounting-connector/"
          } finally {
            $check.Dispose()
            Remove-Item -LiteralPath $zipPath -Force
          }

  connector:
    name: Windows print connector
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Parse every Windows PowerShell acceptance/signature/runtime gate.
      # A syntax failure in one would otherwise surface late in acceptance.
      # Parsing is done without running a single line.
      - name: PowerShell scripts parse
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "public/windows/cafe-pos-print-connector.ps1",
            "scripts/verify-packaged-electron-runtime.ps1",
            "scripts/verify-windows-signatures.ps1",
            "scripts/accept-physical-printer.ps1"
          )
          $failed = $false
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f)) {
              Write-Host "::error::$f is missing from the shipped Windows tooling set."
              $failed = $true
              continue
            }
            $tokens = $null; $errors = $null
            # ParseFile takes a [string]; Resolve-Path returns a PathInfo, so
            # take its .Path rather than relying on coercion.
            $full = (Resolve-Path -LiteralPath $f).Path
            [System.Management.Automation.Language.Parser]::ParseFile(
              $full, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "ok  $f"
            }
          }
          if ($failed) { exit 1 }

      - name: PowerShell workflow blocks parse
        run: |
          $ErrorActionPreference = "Stop"
          $workflowFiles = @(
            ".github/workflows/build-desktop-installer.yml",
            ".github/workflows/mobile-real-device-acceptance.yml",
            ".github/workflows/physical-printer-acceptance.yml",
            ".github/workflows/postgresql-tools-artifact.yml",
            ".github/workflows/release-acceptance-aggregate.yml",
            ".github/workflows/release-readiness.yml",
            ".github/workflows/windows-11-release.yml",
            ".github/workflows/windows-production-release.yml",
            ".github/workflows/windows-signed-candidate.yml"
          )
          $failed = $false
          foreach ($file in $workflowFiles) {
            $lines = @(Get-Content -LiteralPath $file)
            for ($index = 0; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -notmatch '^(\s*)run:\s*[|>][-+]?\s*$') { continue }
              $runIndent = $Matches[1].Length
              $bodyIndent = $runIndent + 2
              $body = [System.Collections.Generic.List[string]]::new()
              for ($cursor = $index + 1; $cursor -lt $lines.Count; $cursor++) {
                $line = $lines[$cursor]
                if ($line.Trim().Length -eq 0) { $body.Add(''); continue }
                $null = $line -match '^(\s*)'
                if ($Matches[1].Length -le $runIndent) { break }
                $body.Add($line.Substring([Math]::Min($bodyIndent, $line.Length)))
              }
              $script = ($body -join "`n") -replace '\$\{\{.*?\}\}', 'GHA_EXPRESSION'
              $tokens = $null; $errors = $null
              [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors -and $errors.Count -gt 0) {
                $failed = $true
                foreach ($error in $errors) {
                  $lineNumber = $index + 1 + $error.Extent.StartLineNumber
                  Write-Host "::error file=$file,line=$lineNumber::$($error.Message)"
                }
              }
            }
            if (-not $failed) { Write-Host "ok  $file inline PowerShell" }
          }
          if ($failed) { exit 1 }
