name: build diagnostic

# TEMPORARY (Wave 11 CI triage). The Actions job logs are stored on a blob host
# this workspace cannot reach, so the failing `npm run build` step's message is
# invisible here. This workflow rebuilds on the same runner image as the failing
# jobs and re-emits the tail of the log as an `::error::` annotation, which the
# checks API does return. Delete once the build is green again.

on:
  push:
    branches:
      - arena/01a0fdb4-cafe-restaurant-pos

jobs:
  diagnostic-build:
    name: diagnostic build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "build exit code: $code"
          echo "--- last 80 lines ---"
          tail -n 80 build.log
          exit $code
      - name: Report the build error
        if: failure()
        run: |
          node -e "
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch {}
            const tail = log.split('\n').filter((l) => !l.includes('npm warn')).slice(-70).join('\n').slice(-7000);
            const enc = tail.replace(/%/g, '%25').split('').map((c) => (c === '\n' ? '%0A' : c === '\r' ? '' : c)).join('');
            console.log('::error title=next build failure::' + enc);
          "
