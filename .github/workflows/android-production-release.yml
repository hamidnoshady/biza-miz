name: android-production-release

# Manual, main only. Builds the signed production AAB and APK, tags the commit as
# android-v<version>, and uploads the bundle to a Google Play track only when the
# PLAY_SERVICE_ACCOUNT_JSON secret is configured. The android-production environment is the
# approval gate: give it required reviewers in the repository settings.
#
# The Android version is independent of the web app and of the Windows desktop release.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Android version name, X.Y.Z (independent of the web app version)'
        type: string
        required: true
      version_code:
        description: 'Android version code: a positive integer above every earlier Play upload'
        type: string
        required: true
      play_track:
        description: 'Google Play track for the upload (used only when Play is configured)'
        type: choice
        options: [internal, alpha, beta]
        default: internal
        required: true

concurrency:
  group: android-production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: signed production release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-production
    env:
      RELEASE_VERSION_NAME: ${{ inputs.version_name }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      PLAY_TRACK: ${{ inputs.play_track }}
      BIZA_ANDROID_WEB_ORIGIN_PRODUCTION: ${{ vars.ANDROID_WEB_ORIGIN_PRODUCTION }}
      HAS_PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate the release inputs
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version_name must be X.Y.Z" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "version_code must be a positive integer" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/android-v${RELEASE_VERSION_NAME}" > /dev/null 2>&1; then
            echo "Tag android-v${RELEASE_VERSION_NAME} already exists. Choose a new version_name." >&2
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 36 and build-tools 36.0.0
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the upload keystore into the runner's temporary directory
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "NOT CONFIGURED: ANDROID_KEYSTORE_BASE64 is not set for the android-production environment." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/biza-miz-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "BIZA_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build the production release APK and AAB
        working-directory: android
        env:
          BIZA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BIZA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BIZA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            -PbizaVersionName="$RELEASE_VERSION_NAME" \
            -PbizaVersionCode="$RELEASE_VERSION_CODE" \
            :app:assembleProductionRelease :app:bundleProductionRelease

      - name: Verify the APK signature
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk=$(ls android/app/build/outputs/apk/production/release/*.apk | head -n 1)
          "$apksigner" verify --print-certs "$apk"

      - name: Tag the release commit
        run: |
          set -euo pipefail
          tag="android-v${RELEASE_VERSION_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Android production ${RELEASE_VERSION_NAME} (version code ${RELEASE_VERSION_CODE})" "$GITHUB_SHA"
          git push origin "$tag"

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: biza-miz-android-${{ env.RELEASE_VERSION_NAME }}-production
          path: |
            android/app/build/outputs/apk/production/release/*.apk
            android/app/build/outputs/bundle/productionRelease/*.aab
            android/app/build/outputs/mapping/productionRelease/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload to Google Play
        if: env.HAS_PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bizamiz.app
          releaseFiles: android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed

      - name: Remove the decoded keystore
        if: always()
        run: |
          if [ -n "${BIZA_ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$BIZA_ANDROID_KEYSTORE_PATH"
          fi
