# Runs the local checklist CLAUDE.md documents (tsc, unit tests, integration
# tests, build), plus the design checks.
#
# Triggers: `workflow_dispatch` (start it from the Actions tab, as before),
# `pull_request`, and `push` to `main`. The PR trigger exists so the *design*
# checks cannot be skipped — a restyle that drifts the visual language is
# exactly the kind of change a human reviewer waves through, so
# `design-checks` runs on every PR and is one of the jobs `required` fans in.
# The `push` trigger re-runs the same suite once a PR lands on `main`, so a
# bad merge (e.g. two PRs that pass individually but conflict once combined)
# is caught right after merge instead of only at the next manual run.
#
# Everything runs on GitHub-hosted **Windows** runners (`windows-latest`). Two
# consequences of that are baked into this file and should not be "tidied"
# away:
#
#   1. **No `services:` block.** GitHub only supports service containers on
#      Linux runners, so the integration job starts its own PostgreSQL from the
#      `embedded-postgres` devDependency (`npm run db:dev:start`) instead. That
#      is a real PostgreSQL binary, not a reimplementation — the same mechanism
#      the standalone desktop installer ships.
#   2. **PowerShell, not bash.** Every `run:` block here is Windows PowerShell
#      5.1 (`shell: powershell`), which `windows-latest` provides.
#
# Speed: the checks are independent of each other, so they are declared as
# parallel jobs — each GitHub-hosted job gets its own VM, so they really do run
# in parallel. `required` fans in all of them so a single status check names
# the run.
#
# Two jobs exist specifically for «ورود و خروج داده», the platform data
# transfer engine, and they are separate from the general ones on purpose:
#
#   * `api-guard-tests` runs the permission/guard sweeps on their own, so a PR
#     that weakens an API gate says so in the name of its failing check rather
#     than inside an anonymous "unit tests" run. A permission regression is the
#     one class of bug a reviewer is least likely to spot by reading a diff.
#   * `data-transfer-tests` runs the engine's own integration suite against a
#     real PostgreSQL — import, mapping, templates, validation, duplicates,
#     relationships, every export format, the queue and multi-tenant isolation
#     — plus the whole-schema tenant-isolation sweep, which is what proves the
#     engine's six new tables cannot leak across businesses.
name: test

on:
  workflow_dispatch:
    inputs:
      record_baselines:
        description: >-
          Re-record the visual baselines and upload them as an artifact instead
          of comparing. Use only for a reviewed, intended design change; the
          images still have to be committed and looked at in the diff.
        type: boolean
        default: false
  pull_request:
  # GitHub suppresses PR-synchronize events created by the Arena GitHub App.
  # Run the same required suite on Arena branch pushes so review cannot bypass it.
  push:
    branches: [main, 'arena/**']

# A newer manual run on the same ref supersedes one still in flight. Keep PR
# and Arena-push groups distinct: cancelling one creates failed/cancelled check
# contexts on the shared commit even when the surviving suite passes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Windows PowerShell 5.1 — always present on Windows, unlike `pwsh`.
    shell: powershell

env:
  NODE_OPTIONS: --max-old-space-size=3072
  # Session signing is not what's under test here, but the auth/webauthn
  # suites do need a real (non-placeholder) secret, and vitest/next build
  # don't read .env. Throwaway value, CI-only, never used to sign anything real.
  JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef

jobs:
  lint:
    name: ESLint (noninteractive)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: type check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: production build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  integration-tests:
    name: integration tests (real database)
    runs-on: windows-latest

    env:
      # A high port so the job never collides with a PostgreSQL the developer
      # has installed on this machine for their own use.
      PGPORT: "55432"
      DATABASE_URL: postgres://pos:pos@127.0.0.1:55432/pos

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # A cluster left running by a cancelled run would hold the port and make
      # every later run fail; clear it before creating a fresh one.
      - name: Stop a cluster left behind by a previous run
        continue-on-error: true
        env:
          PGDATA: ${{ runner.temp }}\pos-pgdata
        run: npm run db:dev:stop

      - name: Start PostgreSQL
        env:
          PGDATA: ${{ runner.temp }}\pos-pgdata
        run: |
          # Always a clean cluster: the integration suites create their own
          # scratch databases, so there is nothing here worth keeping between
          # runs, and a fresh initdb cannot inherit a half-broken state.
          if (Test-Path -LiteralPath $env:PGDATA) {
            Remove-Item -LiteralPath $env:PGDATA -Recurse -Force
          }
          npm run db:dev:start

      - name: Apply migrations
        run: npm run db:migrate

      - name: Re-apply migrations (must be a no-op)
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:db

      - name: Stop PostgreSQL
        if: always()
        continue-on-error: true
        env:
          PGDATA: ${{ runner.temp }}\pos-pgdata
        run: npm run db:dev:stop

  # Permission and guard coverage, named so a regression is legible in the
  # check list. `api-guards` asserts every route under src/app/api has a real
  # guard (and that the data-transfer routes re-check the *entity's* own
  # permission, not just the engine key); `permissions` and `settings-tabs`
  # pin the role presets and the tab visibility the screens are built from.
  #
  # Linux: these read files and evaluate pure functions, so they are
  # platform-independent and a Linux runner starts in a fraction of the time.
  api-guard-tests:
    name: API guard and permission tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API guards, permissions and settings visibility
        run: |
          npx vitest run \
            src/app/api/api-guards.test.ts \
            src/lib/permissions.test.ts \
            src/lib/settings-tabs.test.ts \
            src/lib/settings-routes.test.ts \
            src/app/route-tree.test.ts \
            src/app/route-smoke.test.ts

  # «ورود و خروج داده» against a real database: the engine's own integration
  # suite plus the two schema-wide sweeps its new tables have to satisfy.
  #
  # Ubuntu with a service container rather than Windows + embedded-postgres:
  # this job is new, so it is free to use the faster mechanism, and the
  # migrations are re-applied here too (the `integration-tests` job proves
  # idempotency on Windows).
  data-transfer-tests:
    name: data transfer engine (real database)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pos:pos@127.0.0.1:55432/pos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      - name: Re-apply migrations (must be a no-op)
        run: npm run db:migrate
      - name: Import/export engine, tenant isolation and migration sweeps
        run: |
          npx vitest run --config vitest.db.config.ts \
            integration/data-transfer.integration.test.ts \
            integration/tenant-isolation.integration.test.ts \
            integration/migrations.integration.test.ts

  # The design system's executable half: the banned-pattern lint, the
  # structural primitive lint, and the loading-state coverage test. Split out
  # of `unit-tests` so a PR that only drifts the visuals names the reason in
  # its status check instead of failing an anonymous "unit tests" run.
  #
  # Linux, not Windows: these three read files and match regexes, so they are
  # platform-independent and a Linux runner starts in a fraction of the time.
  design-checks:
    name: design checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Design lint, primitive lint and loading coverage
        run: |
          npx vitest run \
            src/app/dashboard/design-lint.test.ts \
            src/app/design-lint.test.ts \
            src/app/dashboard/primitive-lint.test.ts \
            src/app/loading-coverage.test.ts

  # Renders representative screens of all four apps in a pinned Chromium and
  # compares them with the committed baselines. Read
  # docs/design/visual-regression.md before touching a baseline: a changed
  # snapshot is reviewed as a visual diff and re-recorded deliberately, never
  # auto-accepted to make a red run go green.
  visual-regression:
    name: visual regression
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PGPORT: "55432"
      DATABASE_URL: postgres://pos:pos@127.0.0.1:55432/pos
      JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef
      # Deterministic rendering: one timezone, one locale, one seed, so a
      # snapshot only changes when the design does.
      TZ: Asia/Tehran
      SEED_OWNER_PASSWORD: owner1234
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium (pinned by the playwright dependency)
        run: npx playwright install --with-deps chromium
      - name: Start PostgreSQL
        run: npm run db:dev:start
      - name: Apply migrations and seed deterministic data
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed:visual
      - name: Provision the unprivileged application role
        # A production boot refuses to serve if the database role bypasses RLS
        # (a superuser silently ignores every tenant-isolation policy), so the
        # visual run needs the same role a real deployment uses.
        env:
          APP_DB_PASSWORD: ci-only-app-role-password
        run: npm run db:app-role
      - name: Build
        run: npm run build
      - name: Start the production server
        # The baselines are recorded against a production build, not `next dev`:
        # the dev server compiles routes on demand, so the first visit to each
        # screen races a webpack build and the shot can catch a half-rendered
        # page. This fixture covers Cloud applications, so its runtime role is
        # explicit rather than inheriting site-role inference from a loopback
        # test host. `BIND_ADDR` remains explicit for deterministic binding.
        run: |
          BIND_ADDR=127.0.0.1 PORT=3000 DEPLOYMENT_ROLE=central \
          DATABASE_URL=postgres://pos_app:ci-only-app-role-password@127.0.0.1:55432/pos \
          npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy within 60s"
          echo "--- server log ---"; cat server.log 2>/dev/null || true
          exit 1
      - name: Visual regression
        if: ${{ inputs.record_baselines != true }}
        run: |
          set -o pipefail
          npm run test:visual 2>&1 | tee visual-output.log
      # Recording runs only when explicitly asked for on a manual dispatch, so
      # no ordinary PR or push can quietly re-record its way to green. The
      # images are uploaded, never committed by CI — a baseline is an approval,
      # and approving it is a human's job.
      - name: Record visual baselines (manual, opt-in)
        if: ${{ inputs.record_baselines == true }}
        run: |
          set -o pipefail
          npm run test:visual:update 2>&1 | tee visual-output.log
      - name: Upload re-recorded baselines
        if: ${{ inputs.record_baselines == true }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: docs/design/visual/*.png
      - name: Publish visual regression summary
        if: always()
        run: |
          if [ -f visual-output.log ]; then
            {
              echo '### Visual regression output'
              echo '```text'
              tail -n 100 visual-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: docs/design/visual/__diff__/
          if-no-files-found: ignore
      - name: Stop PostgreSQL
        if: always()
        continue-on-error: true
        run: npm run db:dev:stop

  # A real Chromium driving the real rendered UI end-to-end for the Media
  # Library — upload/tag/search/folder-move/trash-restore, the universal
  # Media Picker reused from a second app (CRM), and the named
  # media.view/menu.view permission bug exercised as an actual PIN-login
  # Cashier session. A separate job (not a step tacked onto
  # `visual-regression`) so this suite's own pass/fail is never masked by an
  # unrelated, already-tracked baseline-image diff in that job.
  media-e2e-tests:
    name: media E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PGPORT: "55433"
      DATABASE_URL: postgres://pos:pos@127.0.0.1:55433/pos
      JWT_SECRET: ci-only-throwaway-secret-0123456789abcdef0123456789abcdef
      TZ: Asia/Tehran
      SEED_OWNER_PASSWORD: owner1234
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium (pinned by the playwright dependency)
        run: npx playwright install --with-deps chromium
      - name: Start PostgreSQL
        run: npm run db:dev:start
      - name: Apply migrations and seed
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Provision the unprivileged application role
        env:
          APP_DB_PASSWORD: ci-only-app-role-password
        run: npm run db:app-role
      - name: Build
        run: npm run build
      - name: Start the production server
        run: |
          BIND_ADDR=127.0.0.1 PORT=3000 \
          DATABASE_URL=postgres://pos_app:ci-only-app-role-password@127.0.0.1:55433/pos \
          npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy within 60s"
          echo "--- server log ---"; cat server.log 2>/dev/null || true
          exit 1
      - name: Media E2E
        # The script itself writes platform_media_config directly (an
        # in-process mock S3, not the pos_app role) — it needs the
        # superuser-ish seeding connection, not the unprivileged runtime role
        # the server above uses.
        run: npm run test:e2e:media
      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
      - name: Stop PostgreSQL
        if: always()
        continue-on-error: true
        run: npm run db:dev:stop

  # Single status check that fails if any job failed, was cancelled, or
  # never ran.
  required:
    name: all checks passed
    runs-on: windows-latest
    needs: [lint, typecheck, unit-tests, build, integration-tests, api-guard-tests, data-transfer-tests, design-checks, visual-regression, media-e2e-tests]
    if: always()
    steps:
      - name: Check job results
        run: |
          if ("${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" -eq "true") {
            Write-Host "::error::One or more required checks failed."
            exit 1
          }
